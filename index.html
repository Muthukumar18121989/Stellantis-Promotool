function ComparePage() {
  const c = state.compare;
  if (!c) return '';
  if (!c.data) return `<section class="card sel-body"><div class="empty">
    <span class="ei">${icon('compare', 22)}</span><h3>Lining the promotions up…</h3></div></section>`;
  return `${CompareConfigCard(c.data)}${CompareFamilyCard(c.data)}${CompareOutputCard(c.data)}`;
}

function renderCompare() {
  el('viewCompare').innerHTML = ComparePage();
  wireMotion(el('viewCompare'));
}

async function goCompare() {
  const ids = [...state.selection];
  if (ids.length < 2) return;
  state.compare = {
    ids, data: null,
    draft: { familyId: '', articleId: '' },     // what the pickers show
    applied: { familyId: '', articleId: '' },   // what Apply committed
    openFamilies: new Set()
  };
  state.config = null; state.validation = null;
  showView('compare');
  await loadCompare();
}

async function loadCompare() {
  const c = state.compare;
  if (!c) return;
  c.data = await TwinXService.compare({
    ids: c.ids, familyId: c.applied.familyId, articleId: c.applied.articleId,
    optionsFamilyId: c.draft.familyId
  });
  if (state.view === 'compare') renderCompare();
}

function wireCompare() {
  const host = el('viewCompare');

  host.addEventListener('click', async e => {
    const c = state.compare;
    if (!c) return;

    const fam = e.target.closest('[data-cmp-fam]');
    if (fam) {
      const id = fam.dataset.cmpFam;
      c.openFamilies.has(id) ? c.openFamilies.delete(id) : c.openFamilies.add(id);
      renderCompare(); return;
    }
    if (e.target.closest('#cmpApply')) {
      c.applied = { familyId: c.draft.familyId, articleId: c.draft.articleId };
      await loadCompare();
      toast('Comparison filtered.'); return;
    }
    if (e.target.closest('#cmpReset')) {
      c.draft = { familyId: '', articleId: '' };
      c.applied = { familyId: '', articleId: '' };
      await loadCompare(); return;
    }
    if (e.target.closest('#cmpExport')) {
      toast('The comparison export endpoint is not connected yet.', 'info'); return;
    }
  });

  /* The pickers only stage a choice; Apply is what moves the table. */
  host.addEventListener('change', async e => {
    const c = state.compare;
    if (!c) return;
    if (e.target.id === 'cmpFamily') {
      c.draft.familyId = e.target.value;
      c.draft.articleId = '';
      await loadCompare(); return;
    }
    if (e.target.id === 'cmpArticle') c.draft.articleId = e.target.value;
  });
}

/* =======  Promotion Validation / Logistics Volume Split  ================= */
const CYCLE_TYPES = [
  { id: 'monthly', label: 'Monthly' }, { id: 'quarterly', label: 'Quarterly' },
  { id: 'campaign', label: 'Campaign' }
];
const ORDER_TYPES = [
  { id: 'preorder', label: 'Pre-order' }, { id: 'standing', label: 'Standing order' },
  { id: 'topup', label: 'Top-up' }
];

const splitTotal = row => Math.round(row.entered.reduce((n, v) => n + (Number(v) || 0), 0) * 10) / 10;
const splitUnits = row => row.entered.reduce((n, v) => n + Math.round(row.totalVolume * (Number(v) || 0) / 100), 0);
const splitTone = pct => pct > 100.5 ? 'bad' : pct < 99.5 ? 'warn' : 'ok';

function ValidationPage() {
  const v = state.validation;
  if (!v) return '';
  const p = v.promo, months = v.months;

  const fact = (k, val, mono) =>
    `<span class="f"><span class="k">${esc(k)}</span><span class="v${mono ? ' mono' : ''}">${esc(val)}</span></span>`;

  const shown = v.expanded
    ? v.rows.filter(r => r.id === v.expanded)
    : v.rows.slice((v.page - 1) * v.pageSize, v.page * v.pageSize);
  const pages = Math.max(1, Math.ceil(v.rows.length / v.pageSize));

  const cell = (row, i) => {
    const pct = row.entered[i];
    const units = Math.round(row.totalVolume * (Number(pct) || 0) / 100);
    return `<td class="c-split">
      <span class="sp">
        <span class="sp-in">
          <input type="number" min="0" max="100" step="0.1" value="${pct}"
            data-split="${esc(row.id)}" data-month="${i}"
            aria-label="${esc(row.name)} share for ${esc(months[i].label)}"><span class="su">%</span>
        </span>
        <span class="sp-u"><b class="mono">${nf(units)}</b> units</span>
        <span class="sp-r">REC: ${nf1(row.rec[i])}%</span>
      </span>
    </td>`;
  };

  const rowHtml = row => {
    const pct = splitTotal(row), tone = splitTone(pct);
    const open = v.expanded === row.id;
    return `<tr data-split-row="${esc(row.id)}"${row.kind === 'Article' ? ' class="is-article"' : ''}>
      <td class="c-tog">${row.kind === 'Family'
        ? `<button class="rowtog" data-split-expand="${esc(row.id)}" aria-expanded="${open}"
             aria-label="${open ? 'Collapse' : 'Expand'} ${esc(row.name)}"><span class="car">${icon('chevDown', 14)}</span></button>`
        : ''}</td>
      <td class="c-who"><span class="kd">${esc(row.kind)}</span><span class="nm">${esc(row.name)}</span></td>
      <td class="c-vol"><b class="mono">${nf(row.totalVolume)}</b> <span class="u">Units</span></td>
      ${months.map((m, i) => cell(row, i)).join('')}
      <td class="c-rowtot">
        <span class="rt-badge t-${tone}">
          <span class="l">Total</span>
          <span class="p mono">${nf1(pct)}%</span>
          <span class="u mono">${nf(splitUnits(row))} units</span>
        </span>
      </td>
    </tr>`;
  };

  const body = shown.map(r => rowHtml(r) +
    (v.expanded === r.id ? r.articles.map(rowHtml).join('') : '')).join('');

  return `
    <section class="sumband" aria-label="Promotion summary">
      <div class="cs">
        ${fact('Promo Name:', p.name)}
        ${fact('Promo Type:', p.type)}
        ${fact('Iteration:', '#' + p.iteration, true)}
        ${fact('Promo ID:', '#' + p.id, true)}
        ${fact('Markets:', p.markets)}
        ${fact('Created By:', p.createdBy)}
        ${fact('Execution Period:', p.window, true)}
      </div>
      <button class="iconbtn" id="vaExport" title="Download the volume split"
              aria-label="Download the volume split">${icon('download', 16)}</button>
    </section>

    <section class="card" aria-label="Pre-order volume split">
      <div class="card-head"><span class="bar"></span><h2>Define Pre-Order Volume Split (Family &amp; Article Level)</h2></div>
      <div class="card-body">
        <div class="va-controls">
          <input type="date" id="vaStart" aria-label="Choose start date" value="${esc(v.values.start)}">
          <input type="date" id="vaEnd" aria-label="Choose end date" value="${esc(v.values.end)}">
          <input type="text" id="vaComments" placeholder="Enter Your Comments" value="${esc(v.values.comments)}">
          <select id="vaCycle" aria-label="Cycle type">
            <option value="">Cycle Type</option>
            ${CYCLE_TYPES.map(c => `<option value="${c.id}"${c.id === v.values.cycle ? ' selected' : ''}>${esc(c.label)}</option>`).join('')}
          </select>
          <select id="vaOrder" aria-label="Order type">
            <option value="">Order Type</option>
            ${ORDER_TYPES.map(o => `<option value="${o.id}"${o.id === v.values.order ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
          </select>
        </div>

        <div class="va-bar">
          <span class="t">
            <b>Define % Split Per Family and Article</b>
            <span class="s"><span class="mono">${v.rows.length}</span> ${v.rows.length === 1 ? 'Family' : 'Families'}
              <span class="sep">|</span> <span class="mono">${nf(v.skus)}</span> Targeted SKUs</span>
          </span>
          <button class="btn btn-primary" id="vaApplyRec">Apply Recommended Split</button>
          <button class="iconbtn" id="vaReset" title="Reset every split"
                  aria-label="Reset every split">${icon('refresh', 16)}</button>
        </div>

        <div class="fam-scroll">
          <table class="fam-table va-table">
            <thead><tr>
              <th class="c-tog"></th>
              <th class="c-who">Family /<br>Article Details</th>
              <th class="c-vol">Total<br>Volume</th>
              ${months.map(m => `<th class="c-split">${esc(m.label)}</th>`).join('')}
              <th class="c-rowtot">Row Total<br><span class="sub">&amp;-units</span></th>
            </tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>

        <div class="va-foot">
          ${v.expanded
            ? `<button class="btn-link" id="vaBackToFamilies">Back to all families</button>`
            : `<span class="count">showing ${(v.page - 1) * v.pageSize + 1}-${Math.min(v.page * v.pageSize, v.rows.length)} of ${v.rows.length} families</span>
               <span class="pages">
                 <button class="pg" data-va-page="${v.page - 1}" ${v.page === 1 ? 'disabled' : ''} aria-label="Previous page">${icon('chevLeft', 14)}</button>
                 ${pageWindow(v.page, pages).map(n => n === '…' ? '<span class="pg-gap">…</span>'
                   : `<button class="pg${n === v.page ? ' cur' : ''}" data-va-page="${n}" ${n === v.page ? 'aria-current="page"' : ''}>${n}</button>`).join('')}
                 <button class="pg" data-va-page="${v.page + 1}" ${v.page === pages ? 'disabled' : ''} aria-label="Next page">${icon('chevRight', 14)}</button>
               </span>`}
          <span class="right">
            <button class="btn btn-ghost" id="vaCancel">Cancel</button>
            <button class="btn btn-primary" id="vaInitiate">Initiate Approval</button>
          </span>
        </div>
      </div>
    </section>`;
}

function renderValidation() { el('viewValidation').innerHTML = ValidationPage(); }

function durationLabel(start, end) {
  if (!start || !end) return '…';
  const a = new Date(start + 'T00:00:00Z').getTime(), b = new Date(end + 'T00:00:00Z').getTime();
  if (isNaN(a) || isNaN(b) || b < a) return '…';
  const days = Math.round((b - a) / 864e5) + 1;
  return days === 1 ? '1 day' : `${days} days`;
}

function renderConfig() { el('viewConfig').innerHTML = ConfigPage(); }

/* --- routing ----------------------------------------------------------- */
function showView(name) {
  state.view = name;
  el('viewExperiments').hidden = name !== 'experiments';
  el('viewConfig').hidden = name !== 'configuration';
  el('viewValidation').hidden = name !== 'validation';
  el('viewReports').hidden = name !== 'reports';
  el('viewCompare').hidden = name !== 'compare';
  renderHead();
  if (name === 'configuration') renderConfig();
  if (name === 'validation') renderValidation();
  if (name === 'reports') renderReports();
  if (name === 'compare') renderCompare();
  const sc = document.scrollingElement || document.documentElement;
  sc.scrollTop = 0;
  el('main').focus({ preventScroll: true });
}

function goExperiments() {
  state.config = null;
  state.validation = null;
  state.compare = null;
  showView('experiments');
}

async function goConfig(type, draft) {
  const [id, markets, brands, promoApplicability, periods] = await Promise.all([
    TwinXService.reserveExperimentId(),
    state.markets.length ? state.markets : TwinXService.getMarkets(),
    state.brands.length ? state.brands : TwinXService.getBrands(),
    state.promoApplicability.length ? state.promoApplicability : TwinXService.getPromoApplicability(),
    state.periods.length ? state.periods : TwinXService.getPeriods()
  ]);
  Object.assign(state, { markets, brands, promoApplicability, periods });
  const today = new Date().toISOString().slice(0, 10);
  const plus30 = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
  state.config = {
    type, draft, step: 0, experimentId: null, drill: null, exclusions: {},
    selection: { families: [], skus: 0, rows: [], collapsed: new Set() },
    results: null, resultsExpanded: new Set(),
    resultsFilter: { familyId: '', articleId: '', withThreshold: false },
    values: {
      id, iteration: 1, name: draft.title, market: '', allMarkets: true,
      applicability: promoApplicability[0].id, brand: '', start: today, end: plus30
    }
  };
  closeAllDialogs();
  showView('configuration');
  setTimeout(() => { const n = el('cfName'); if (n) n.focus({ preventScroll: true }); }, 60);
}

/* --- configuration page events ----------------------------------------- */
function wireConfig() {
  const host = el('viewConfig');

  const readValues = () => {
    const c = state.config; if (!c || c.step !== 0) return;
    const g = id => { const n = document.getElementById(id); return n ? n.value : ''; };
    c.values.name = g('cfName');
    c.values.market = g('cfMarket');
    c.values.brand = g('cfBrand');
    c.values.start = g('cfStart');
    c.values.end = g('cfEnd');
    const all = document.getElementById('cfAllMarkets');
    if (all) c.values.allMarkets = all.checked;
    const appl = host.querySelector('input[name="cfAppl"]:checked');
    if (appl) c.values.applicability = appl.value;
  };

  const syncDuration = () => {
    const d = document.getElementById('cfDuration');
    if (d && state.config) d.value = durationLabel(state.config.values.start, state.config.values.end);
  };

  let artT = 0;
  host.addEventListener('input', e => {
    const c = state.config; if (!c) return;
    if (c.drill && (e.target.id === 'prUniDiscount' || e.target.id === 'prUniThreshold')) {
      const key = e.target.id === 'prUniDiscount' ? 'discountRpa' : 'thresholdQty';
      const n = Math.max(0, Number(e.target.value) || 0);
      if (key === 'discountRpa') c.drill.uniDiscount = n; else c.drill.uniThreshold = n;
      applyUniversal(c.drill, key, n).then(() => {
        renderDrill();
        setTimeout(() => {
          const h2 = el('drillHost'), f = h2 && h2.querySelector('#' + e.target.id);
          if (f) f.focus({ preventScroll: true });
        }, 20);
      });
      return;
    }
    const disc = e.target.closest('[data-disc]');
    if (disc && c.drill) {
      const id = disc.dataset.disc;
      const n = Math.max(0, Math.min(99, Number(disc.value) || 0));
      c.drill.priceEdits[id] = Object.assign({}, c.drill.priceEdits[id], { discountRpa: n });
      const row = disc.closest('tr');
      const a = (c.drill.rows || []).find(x => x.id === id);
      if (row && a) {
        const after = afterPromo(a.price, n);
        row.querySelectorAll('.v-input')[0].textContent = nf2(after.promoPrice);
        row.querySelectorAll('.v-input')[1].textContent = nf2(after.margin);
      }
      return;
    }
    const thr = e.target.closest('[data-thr]');
    if (thr && c.drill) {
      const id = thr.dataset.thr;
      const n = Math.max(0, Number(thr.value) || 0);
      c.drill.priceEdits[id] = Object.assign({}, c.drill.priceEdits[id], { thresholdQty: n });
      return;
    }
    const od = e.target.closest('[data-odmma]');
    if (od && c.drill) {
      const id = od.dataset.odmma;
      const n = Math.max(0, Math.min(100, Number(od.value) || 0));
      c.drill.volumeEdits[id] = Object.assign({}, c.drill.volumeEdits[id], { odmma: n });
      return;
    }
    if (e.target.id === 'artSearch' && c.drill) {
      c.drill.search = e.target.value; c.drill.page = 1;
      clearTimeout(artT); artT = setTimeout(async () => {
        await renderDrill();
        const n = el('drillHost') && el('drillHost').querySelector('#artSearch');
        if (n) { n.focus({ preventScroll: true }); try { n.setSelectionRange(n.value.length, n.value.length); } catch (err) {} }
      }, 200);
      return;
    }
    readValues();
    if (e.target.id === 'cfStart' || e.target.id === 'cfEnd') syncDuration();
  });

  host.addEventListener('change', async e => {
    const c = state.config; if (!c) return;

    if (c.drill) {
      if (e.target.id === 'artAll') {
        const ids = [...host.querySelectorAll('[data-excl]')].map(n => n.dataset.excl);
        ids.forEach(id => e.target.checked ? c.drill.excluded.add(id) : c.drill.excluded.delete(id));
        renderDrill(); return;
      }
      const exn = e.target.closest('[data-excl]');
      if (exn) {
        exn.checked ? c.drill.excluded.add(exn.dataset.excl) : c.drill.excluded.delete(exn.dataset.excl);
        renderDrill(); return;
      }
      if (e.target.id === 'volAllMarkets') {
        c.drill.allMarkets = e.target.checked;
        if (e.target.checked) c.drill.region = '';
        renderDrill(); return;
      }
      if (e.target.id === 'volRegion') { c.drill.region = e.target.value; renderDrill(); return; }
      if (e.target.id === 'volPeriod') { c.drill.period = e.target.value; renderDrill(); return; }
      if (e.target.id === 'volAll') {
        const ids = [...host.querySelectorAll('[data-volpick]')].map(n => n.dataset.volpick);
        ids.forEach(id => e.target.checked ? c.drill.volPicked.add(id) : c.drill.volPicked.delete(id));
        renderDrill(); return;
      }
      const vp = e.target.closest('[data-volpick]');
      if (vp) {
        vp.checked ? c.drill.volPicked.add(vp.dataset.volpick) : c.drill.volPicked.delete(vp.dataset.volpick);
        renderDrill(); return;
      }
      if (e.target.id === 'prAll') {
        const ids = [...host.querySelectorAll('[data-prpick]')].map(n => n.dataset.prpick);
        ids.forEach(id => e.target.checked ? c.drill.prPicked.add(id) : c.drill.prPicked.delete(id));
        renderDrill(); return;
      }
      const pp = e.target.closest('[data-prpick]');
      if (pp) {
        pp.checked ? c.drill.prPicked.add(pp.dataset.prpick) : c.drill.prPicked.delete(pp.dataset.prpick);
        renderDrill(); return;
      }
      if (e.target.id === 'prThrAll') {
        const ids = [...host.querySelectorAll('[data-thrpick]')].map(n => n.dataset.thrpick);
        ids.forEach(id => e.target.checked ? c.drill.thrPicked.add(id) : c.drill.thrPicked.delete(id));
        renderDrill(); return;
      }
      const tp = e.target.closest('[data-thrpick]');
      if (tp) {
        tp.checked ? c.drill.thrPicked.add(tp.dataset.thrpick) : c.drill.thrPicked.delete(tp.dataset.thrpick);
        renderDrill(); return;
      }
      if (e.target.id === 'prCopyDiscount') {
        c.drill.copyDiscount = e.target.checked;
        await copyRecommendedDiscounts(c.drill, e.target.checked);
        renderDrill(); return;
      }
      if (e.target.id === 'volCopy') {
        c.drill.copyTargets = e.target.checked;
        await copyRecommendedTargets(c.drill, e.target.checked);
        renderDrill(); return;
      }
    }

    if (c.step === 2) {
      if (e.target.id === 'simFamily') {
        c.resultsFilter.familyId = e.target.value;
        c.resultsFilter.articleId = '';
        c.resultsExpanded = new Set(e.target.value ? [e.target.value] : []);
        renderConfig(); return;
      }
      if (e.target.id === 'simArticle') {
        c.resultsFilter.articleId = e.target.value;
        if (e.target.value && c.resultsFilter.familyId) c.resultsExpanded.add(c.resultsFilter.familyId);
        renderConfig(); return;
      }
      return;
    }

    readValues();
    if (e.target.id === 'cfAllMarkets') {
      const sel = document.getElementById('cfMarket');
      sel.disabled = e.target.checked;
      if (e.target.checked) { sel.value = ''; state.config.values.market = ''; }
    }
    syncDuration();
  });

  host.addEventListener('click', async e => {
    const c = state.config; if (!c) return;

    if (e.target.closest('#cfManage')) { openSelectFamily(); return; }

    const tog = e.target.closest('[data-toggle-fam]');
    if (tog) {
      const id = tog.dataset.toggleFam;
      const body = document.getElementById('fp-' + id);
      const open = tog.getAttribute('aria-expanded') === 'true';
      tog.setAttribute('aria-expanded', String(!open));
      if (body) body.hidden = open;
      open ? c.selection.collapsed.add(id) : c.selection.collapsed.delete(id);
      return;
    }

    const drill = e.target.closest('[data-drill-fam]');
    if (drill) { openDrill(drill.dataset.drillFam); return; }

    const tab = e.target.closest('[data-tab]');
    if (tab && c.drill) {
      c.drill.tab = tab.dataset.tab; c.drill.page = 1;
      renderConfig(); renderDrill(); return;
    }

    if (e.target.closest('#prValidate') && c.drill) {
      c.drill.validated = true;
      await renderDrill();
      const host2 = el('drillHost');
      const n = host2 ? host2.querySelectorAll('.sev').length : 0;
      toast(n ? `Validated. <b class="mono">${n}</b> ${n === 1 ? 'article needs' : 'articles need'} attention on this page.`
              : 'Validated. Every threshold on this page is within range.', 'info');
      return;
    }

    const ex = e.target.closest('[data-expand]');
    if (ex && c.drill) {
      const id = ex.dataset.expand;
      c.drill.expanded.has(id) ? c.drill.expanded.delete(id) : c.drill.expanded.add(id);
      const row = document.getElementById('tr-' + id);
      ex.setAttribute('aria-expanded', String(c.drill.expanded.has(id)));
      if (row) row.hidden = !c.drill.expanded.has(id);
      return;
    }

    const ap = e.target.closest('[data-art-page]');
    if (ap && !ap.disabled && c.drill) { c.drill.page = Number(ap.dataset.artPage); renderDrill(); return; }

    const drop = e.target.closest('[data-drop-fam]');
    if (drop) {
      const id = drop.dataset.dropFam;
      c.selection.families = c.selection.families.filter(x => x !== id);
      c.selection.rows = (c.selection.rows || []).filter(f => f.id !== id);
      c.selection.skus = c.selection.rows.reduce((n, f) => n + f.articles, 0);
      renderConfig();
      syncDraftFamilies();
      return;
    }

    if (e.target.closest('#cfBack')) {
      if (c.drill) { c.drill = null; renderConfig(); scrollTopMain(); return; }
      if (c.step > 0) { c.step -= 1; renderConfig(); scrollTopMain(); return; }
      goExperiments(); openNewPromotion(); return;
    }

    if (e.target.closest('#cfSimulate')) { runSimulation(); return; }

    const simEx = e.target.closest('[data-sim-expand]');
    if (simEx) {
      const id = simEx.getAttribute('data-sim-expand');
      if (c.resultsExpanded.has(id)) c.resultsExpanded.delete(id); else c.resultsExpanded.add(id);
      renderConfig();
      return;
    }

    if (e.target.closest('#simThreshold')) {
      c.resultsFilter.withThreshold = !c.resultsFilter.withThreshold;
      renderConfig();
      return;
    }

    if (e.target.closest('#simClose')) { goExperiments(); return; }

    if (e.target.closest('#simEdit')) {
      c.step = 0; c.drill = null;
      renderHead(); renderConfig(); scrollTopMain();
      return;
    }

    if (e.target.closest('#simSubmit')) { openSubmitApproval(); return; }

    const next = e.target.closest('#cfNext');
    if (!next) return;

    if (c.step === 1) {
      if (!c.selection.families.length) return;      // Next is disabled until families exist
      runSimulation();
      return;
    }

    readValues();
    const v = c.values, err = el('cfErr');
    const fail = (msg, focusId) => {
      err.textContent = msg; err.hidden = false;
      const n = focusId && document.getElementById(focusId);
      if (n) n.focus({ preventScroll: true });
    };
    if (!v.name.trim()) return fail('Enter a name for the promotion.', 'cfName');
    if (!v.allMarkets && !v.market) return fail('Select a market, or apply the same configuration to all markets.', 'cfMarket');
    if (!v.start || !v.end) return fail('Set both a start date and an end date.', 'cfStart');
    if (v.start > v.end) return fail('The start date must fall on or before the end date.', 'cfStart');
    err.hidden = true;

    next.disabled = true;
    if (!c.experimentId) {
      const row = await TwinXService.createExperiment({
        projectId: state.projectId, name: v.name.trim(), region: 'Europe',
        startDate: v.start, endDate: v.end, families: 0,
        productTypes: state.scopes[0].types.map(t => t.id),
        networkTypes: state.scopes[1].types.map(t => t.id),
        simulationType: c.draft.simulationType, promotionType: c.type.id,
        markets: v.allMarkets ? state.markets.map(m => m.id) : [v.market],
        allMarkets: v.allMarkets, brand: v.brand || null, applicability: v.applicability
      });
      c.experimentId = row.id;
      state.projects = await TwinXService.getProjects();
      state.filterOptions = await TwinXService.getFilterOptions(state.projectId);
      state.page = 1; state.sort = { key: null, dir: 'asc' };
      renderProjects(); renderFilters();
      await refreshScopes(); await loadExperiments();
      toast(`Saved <b>${esc(row.name)}</b> · <span class="mono">${row.id}</span> as a Draft at Iteration 1.`);
    }
    c.step = 1;
    renderConfig();
    scrollTopMain();
  });
}

/* How long the row's progress bar runs for. The endpoint answers sooner than
   this in the mock; with a real one, the bar holds at 94% until it returns. */
const SIM_RUN_MS = 4200;

/* --- Simulate ----------------------------------------------------------
   Simulate leaves the configuration and hands the work to the experiment
   table: the promotion's row carries a progress bar while the endpoint runs,
   and its Simulation results action opens the result page. */
async function runSimulation() {
  const c = state.config;
  if (!c || !c.selection.families.length || !c.experimentId) return;
  const v = c.values;
  const label = (list, id) => { const m = list.find(x => x.id === id); return m ? m.label : ''; };
  const id = c.experimentId;

  c.drill = null;
  c.step = 1;
  c.results = null;
  c.resultsExpanded = new Set();
  if (!c.resultsFilter.familyId) c.resultsFilter.familyId = c.selection.families[0];

  const payload = {
    experimentId: id,
    familyIds: c.selection.families.slice(),
    withThreshold: c.resultsFilter.withThreshold,
    context: {
      countries: v.allMarkets ? 'All markets' : (label(state.markets, v.market) || '—'),
      brands: label(state.brands, v.brand) || 'All brands',
      window: `${v.start} \u2192 ${v.end} (${durationLabel(v.start, v.end)})`,
      logic: c.type.short
    }
  };

  const prev = state.simRuns.get(id);
  if (prev && prev.timer) clearInterval(prev.timer);
  const run = { id, name: v.name, pct: 0, done: false, config: c, results: null, timer: null };
  state.simRuns.set(id, run);

  await TwinXService.updateExperiment(id, {
    familyIds: c.selection.families.slice(), families: c.selection.families.length
  });

  goExperiments();
  state.page = 1;
  await loadExperiments();
  revealRow(id);
  toast(`Simulating <b>${esc(v.name)}</b> · <span class="mono">${id}</span>. The row shows its progress.`, 'info');

  /* The bar is driven on its own so the row keeps moving while the endpoint
     works; it holds just short of the end until the result is in. */
  const started = performance.now();
  run.timer = setInterval(() => {
    const t = (performance.now() - started) / SIM_RUN_MS;
    run.pct = Math.min(94, 100 * (1 - Math.pow(1 - Math.min(1, t), 2.2)));
    paintRun(run);
  }, 90);

  const res = await TwinXService.simulate(payload);
  await new Promise(r => setTimeout(r, Math.max(0, SIM_RUN_MS - (performance.now() - started))));

  clearInterval(run.timer);
  run.timer = null;
  run.pct = 100; run.done = true; run.results = res;
  c.results = res;
  paintRun(run);
  renderWork();
  toast(`<b>${esc(v.name)}</b> · <span class="mono">${id}</span> finished. Open its simulation results from the row.`);
}

/* Repaint one row's progress bar without re-rendering the table. */
function paintRun(run) {
  const bar = document.querySelector(`tr[data-rowid="${run.id}"] .simbar`);
  if (!bar) return;
  const pct = Math.round(run.pct);
  bar.setAttribute('aria-valuenow', pct);
  const fill = bar.querySelector('i'), num = bar.querySelector('.sb-n');
  if (fill) fill.style.width = pct + '%';
  if (num) num.textContent = pct + '%';
}

function revealRow(id) {
  const row = document.querySelector(`tr[data-rowid="${id}"]`);
  if (!row) return;
  row.classList.add('shown', 'is-fresh');
  row.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
  setTimeout(() => row.classList.remove('is-fresh'), 2600);
}

/* The row's results action puts the finished simulation back on screen. */
function openSimResults(id) {
  const run = state.simRuns.get(id);
  if (!run || !run.done) return;
  const c = run.config;
  c.step = 2;
  c.results = run.results;
  state.config = c;
  showView('configuration');
}

/* Submit for approval: the Draft row moves to Submitted for Logistics Review. */
/* Submit for approval opens a review dialog first: the name and iteration can
   still be corrected, and the user picks which discount set goes forward. */
const STRATEGIES = [
  { id: 'user',  label: 'User Input', hint: 'Discount values entered by user' },

  if (!c) return;
  const v = c.values;
  const draft = { strategy: v.strategy || 'user' };

  const dlg = openDialog(`
    <div class="dlg-head">
      <span class="t"><h2>Submit Promotion for Approval</h2>

      <div class="form-rows">

        </div>
        <div class="form-row">

        </div>
        <div class="form-row">

                  <span class="rb"></span><span class="rt">${esc(st.label)} <span class="rh">(${esc(st.hint)})</span></span>

  dlg.addEventListener('click', async e => {

    const name = dlg.querySelector('#apName').value.trim();

/* --- Report Hub --------------------------------------------------------- */
async function goReports() {
  if (!state.reports) {
    state.reports = {
      tab: 'promotions', data: null, elasticity: null,
      filters: { market: '', family: '', part: '', status: '', start: '', end: '' },
      page: 1, aggregate: 'individual',

async function loadReports() {
  const r = state.reports;
  if (!r) return;

    r.data = await TwinXService.reportHub({
      projectId: state.projectId, market: r.filters.market,
      status: r.filters.status, page: r.page, pageSize: 4

    r.elasticity = await TwinXService.elasticity({ sort: r.elSort });
  }

}

function wireReports() {
  const host = el('viewReports');

  host.addEventListener('click', async e => {
    const r = state.reports; if (!r) return;

    const tab = e.target.closest('[data-rep-tab]');
    if (tab) {
      const id = tab.dataset.repTab;
      if (id === r.tab) return;
      r.tab = id; renderReports(); await loadReports(); return;
    }

    const ex = e.target.closest('[data-rep-expand]');
    if (ex) {
      const id = Number(ex.dataset.repExpand);
      r.expanded.has(id) ? r.expanded.delete(id) : r.expanded.add(id);
      renderReports(); return;
    }

    const pg = e.target.closest('[data-rep-page]');
    if (pg && !pg.disabled) { r.page = Number(pg.dataset.repPage); await loadReports(); return; }

    const so = e.target.closest('[data-el-sort]');
    if (so) {
      const k = so.dataset.elSort;
      r.elSort = r.elSort.key === k
        ? (r.elSort.dir === 'asc' ? { key: k, dir: 'desc' } : { key: null, dir: 'asc' })
        : { key: k, dir: 'asc' };
      await loadReports(); return;
    }

    if (e.target.closest('#rpApply')) { r.page = 1; await loadReports(); toast('Filters applied.'); return; }
    if (e.target.closest('#rpReset')) {
      r.filters = { market: '', family: '', part: '', status: '', start: '', end: '' };
      r.page = 1; renderReports(); await loadReports();
      toast('Filters cleared.', 'info'); return;
    }
    if (e.target.closest('#elCompare')) {
      toast('Comparing across the family needs the analysis endpoint. The single article stays on screen.', 'info');
      return;
    }
  });

  host.addEventListener('change', async e => {
    const r = state.reports; if (!r) return;
    const map = { rpMarket: 'market', rpFamily: 'family', rpPart: 'part', rpStatus: 'status', rpStart: 'start', rpEnd: 'end' };
    if (map[e.target.id]) { r.filters[map[e.target.id]] = e.target.value; return; }
    if (e.target.id === 'rpAggregate') {
      r.aggregate = e.target.value;
      toast(`Aggregating by <b>${esc((AGGREGATE_BY.find(a => a.id === r.aggregate) || {}).label || '')}</b> needs the report endpoint.`, 'info');
      return;
    }
    const pick = e.target.closest('[data-rep-pick]');
    if (pick) {
      const id = Number(pick.dataset.repPick);
      pick.checked ? r.picked.add(id) : r.picked.delete(id);
      const row = host.querySelector(`tr[data-rep-row="${id}"]`);
      if (row) row.classList.toggle('on', pick.checked);
    }
  });
}

/* --- validation page events -------------------------------------------- */
function wireValidation() {
  const host = el('viewValidation');

  host.addEventListener('click', async e => {
    const v = state.validation; if (!v) return;

    const ex = e.target.closest('[data-split-expand]');
    if (ex) {
      const id = ex.getAttribute('data-split-expand');
      v.expanded = v.expanded === id ? null : id;
      renderValidation(); return;
    }
    if (e.target.closest('#vaBackToFamilies')) { v.expanded = null; renderValidation(); return; }

    const pg = e.target.closest('[data-va-page]');
    if (pg && !pg.disabled) {
      v.page = Number(pg.dataset.vaPage);
      renderValidation(); return;
    }

    if (e.target.closest('#vaApplyRec')) {
      const all = v.rows.flatMap(r => [r, ...r.articles]);
      all.forEach(r => { r.entered = r.rec.slice(); });
      renderValidation();
      toast('Every row now carries the TwinX recommended split.');
      return;
    }
    if (e.target.closest('#vaReset')) {
      v.rows.flatMap(r => [r, ...r.articles]).forEach(r => { r.entered = r.entered.map(() => 0); });
      renderValidation();
      toast('Splits cleared. Enter your own, or apply the recommendation.', 'info');
      return;
    }
    if (e.target.closest('#vaExport')) {
      toast('The export endpoint is not connected yet. The split stays on screen.', 'info');
      return;
    }
    if (e.target.closest('#vaCancel')) {
      state.validation = null;
      goExperiments();
      return;
    }
    if (e.target.closest('#vaInitiate')) { initiateApproval(); return; }
  });

  host.addEventListener('input', e => {
    const v = state.validation; if (!v) return;
    const n = e.target.closest('[data-split]');
    if (!n) return;
    const row = findSplitRow(v, n.dataset.split);
    if (!row) return;
    const i = Number(n.dataset.month);
    row.entered[i] = n.value === '' ? 0 : Math.max(0, Math.min(100, Number(n.value)));
    paintSplitRow(row, n.closest('tr'));
  });

  host.addEventListener('change', e => {
    const v = state.validation; if (!v) return;
    const id = e.target.id;
    if (id === 'vaStart') v.values.start = e.target.value;
    if (id === 'vaEnd') v.values.end = e.target.value;
    if (id === 'vaComments') v.values.comments = e.target.value;
    if (id === 'vaCycle') v.values.cycle = e.target.value;
    if (id === 'vaOrder') v.values.order = e.target.value;
  });
}

function findSplitRow(v, id) {
  for (const r of v.rows) {
    if (r.id === id) return r;
    const a = r.articles.find(x => x.id === id);
    if (a) return a;
  }
  return null;
}

/* Repaint one row's units and its total badge without losing the caret. */
function paintSplitRow(row, tr) {
  if (!tr) return;
  tr.querySelectorAll('.c-split').forEach((td, i) => {
    const u = td.querySelector('.sp-u b');
    if (u) u.textContent = nf(Math.round(row.totalVolume * (Number(row.entered[i]) || 0) / 100));
  });
  const pct = splitTotal(row), badge = tr.querySelector('.rt-badge');
  if (!badge) return;
  badge.className = `rt-badge t-${splitTone(pct)}`;
  badge.querySelector('.p').textContent = nf1(pct) + '%';
  badge.querySelector('.u').textContent = nf(splitUnits(row)) + ' units';
}

/* Initiate Approval hands the promotion to logistics. */
async function initiateApproval() {
  const v = state.validation;
  if (!v) return;
  const bad = v.rows.flatMap(r => [r, ...r.articles]).filter(r => splitTone(splitTotal(r)) !== 'ok');
  if (bad.length) {
    toast(`${bad.length} ${bad.length === 1 ? 'row does' : 'rows do'} not add up to 100%. Fix them, or apply the recommended split.`, 'info');
    return;
  }
  const btn = el('vaInitiate');
  if (btn) btn.disabled = true;
  if (v.experimentId) {
    await TwinXService.updateExperiment(v.experimentId, { status: 'submitted_logistics_review' });
    state.filterOptions = await TwinXService.getFilterOptions(state.projectId);
    renderFilters();
    await refreshScopes();
    await loadExperiments();
  }
  const name = esc(v.promo.name);
  state.validation = null;
  goExperiments();
  toast(`<b>${name}</b> · <span class="mono">${esc(String(v.promo.id))}</span> went to logistics with its volume split.`);
}

async function submitForApproval() {
  const c = state.config;
  if (!c) return;
  const btn = el('simSubmit');
  if (btn) btn.disabled = true;
  const v = c.values;
  if (c.experimentId) {
    await TwinXService.updateExperiment(c.experimentId, {
      status: 'submitted_logistics_review', name: v.name, iteration: v.iteration
    });
    state.filterOptions = await TwinXService.getFilterOptions(state.projectId);
    renderFilters();
    await refreshScopes();
    await loadExperiments();
  }
  const strat = STRATEGIES.find(s => s.id === v.strategy) || STRATEGIES[0];
  const name = esc(v.name || 'The promotion');
  const id = c.experimentId ? ` · <span class="mono">${esc(String(c.experimentId))}</span>` : '';
  closeAllDialogs();
  goExperiments();
  toast(`<b>${name}</b>${id} went for approval on <b>${esc(strat.label)}</b> discounts.`);
}

/* Keep the Draft row in the experiment list in step with the selection. */
async function syncDraftFamilies() {
  const c = state.config;
  if (!c || !c.experimentId) return;
  await TwinXService.updateExperiment(c.experimentId, { families: c.selection.families.length });
  state.filterOptions = await TwinXService.getFilterOptions(state.projectId);
  renderFilters();
  await loadExperiments();
}

/* Copy to Volume Targets: the recommendation becomes the target, and
   unticking puts each article's own target back. */
async function copyRecommendedTargets(drill, on) {
  const res = await TwinXService.listArticles({ familyId: drill.familyId, pageSize: 999 });
  res.rows.forEach(a => {
    const e = drill.volumeEdits[a.id] = drill.volumeEdits[a.id] || {};
    e.promoVolumeTarget = on ? a.volume.recommendedTarget : undefined;
    if (!on) delete e.promoVolumeTarget;
  });
}

/* The universal inputs write through to every article in the family. */
async function applyUniversal(drill, key, value) {
  const res = await TwinXService.listArticles({ familyId: drill.familyId, pageSize: 999 });
  res.rows.forEach(a => {
    drill.priceEdits[a.id] = Object.assign({}, drill.priceEdits[a.id], { [key]: value });
  });
  if (key === 'thresholdQty') drill.validated = false;
}

async function copyRecommendedDiscounts(drill, on) {
  const res = await TwinXService.listArticles({ familyId: drill.familyId, pageSize: 999 });
  res.rows.forEach(a => {
    const e = drill.priceEdits[a.id] = drill.priceEdits[a.id] || {};
    if (on) e.discountRpa = a.price.twinxRecommended; else delete e.discountRpa;
  });
}

function scrollTopMain() {
  const sc = document.scrollingElement || document.documentElement;

}

/* --- Manage Families · the Select Family dialog -------------------------
   Three states. `browse` is the default: search and pick from the pool.
   `upload` appears only when the user asks for it, and shows nothing but the
   file row. `validated` shows the match result over the table, with the
   matched families already ticked.                                        */
function openSelectFamily() {
  const c = state.config;
  const picked = new Set(c.selection.families);
  let q = { byId: '', byName: '', page: 1, pageSize: 6 };
  let res = null, upload = null, mode = 'browse', file = null;

  const dlg = openDialog(`
    <div class="dlg-head">
      <span class="t"><h2>Select Family</h2></span>
      <button class="dlg-x" data-close aria-label="Close">${icon('x', 16)}</button>
    </div>
    <div class="dlg-body" id="famBody"></div>
    <div class="dlg-foot fam-foot" id="famFoot"></div>`, { label: 'Select Family', wide: true });

  const tone = cl => cl === 'High' ? '--c1' : cl === 'Medium' ? '--c5' : '--c8';

  const uploadRow = () => `
    <div class="fam-upload">
      <div class="lead">
        <span class="ulabel">Choose File</span>
        <button class="btn-link" id="famTemplate">Download Template</button>
      </div>
      <div class="uprow">
        <div class="filerow">
          <label class="btn btn-ghost" for="famFile">${icon('upload', 15)} Choose File</label>
          <input type="file" id="famFile" accept=".xlsx,.xls,.csv" hidden>
          <span class="fname${file ? ' set' : ''}" id="famName">${file ? esc(file.name) : 'No file chosen'}</span>
        </div>
        ${mode === 'upload' ? '<button class="btn-link" id="famCancelUpload">Cancel</button>' : ''}
        <button class="btn ${mode === 'validated' ? 'btn-ghost' : 'btn-primary'}" id="famValidate"
          ${file ? '' : 'disabled'}>Validate ${icon('refresh', 15)}</button>
      </div>
    </div>`;

  const bands = () => !upload ? '' : `
    <div class="filemsg ok">${icon('check', 14)}
      <span>${esc(upload.fileName)} - <b class="mono">${upload.matched.length}</b> ${upload.matched.length === 1 ? 'family' : 'families'},
        <b class="mono">${upload.articles.toLocaleString('en-US')}</b> articles matched</span></div>
    ${upload.notFound ? `<div class="filemsg bad">${icon('info', 14)}
      <span><b class="mono">${upload.notFound}</b> article IDs not found</span></div>` : ''}`;

  const searchBar = () => `
    <div class="fam-bar">
      <span class="sbox">${icon('search', 15)}<input type="search" id="famById" placeholder="Search by Family ID" autocomplete="off" value="${esc(q.byId)}"></span>
      <span class="sbox">${icon('search', 15)}<input type="search" id="famByName" placeholder="Search by Family Name" autocomplete="off" value="${esc(q.byName)}"></span>
      <button class="btn btn-ghost" id="famUploadBtn">${icon('upload', 15)} Upload</button>
    </div>`;

  const paintShell = () => {
    const body = dlg.querySelector('#famBody');
    if (mode === 'upload') {
      body.innerHTML = uploadRow();
      dlg.querySelector('#famFoot').hidden = true;
      return;
    }
    dlg.querySelector('#famFoot').hidden = false;
    body.innerHTML = (mode === 'validated' ? uploadRow() + bands() : searchBar()) + '<div id="famTable"></div>';
    renderTable();
  };

  const renderTable = () => {
    const host = dlg.querySelector('#famTable');
    if (!host || !res) return;
    const rows = res.rows;
    const allOnPage = rows.length > 0 && rows.every(f => picked.has(f.id));
    host.innerHTML = rows.length ? `
      <div class="fam-scroll">
        <table class="fam-table">
          <thead><tr>
            <th class="c-pick"><label class="checkline"><input type="checkbox" id="famAll" ${allOnPage ? 'checked' : ''}
              aria-label="Select every family on this page"><span class="bx">${icon('check', 11)}</span></label></th>
            <th>ID</th><th>Family Name</th><th class="c-num"># Articles</th>
            <th>Business Line</th><th>Product Category</th>
            <th>Competitiveness Class</th><th>DFS Flag</th><th>Supplier</th>
          </tr></thead>
          <tbody>${rows.map(f => `
            <tr data-fam="${f.id}"${picked.has(f.id) ? ' class="on"' : ''}>
              <td class="c-pick"><label class="checkline"><input type="checkbox" data-fam-pick="${f.id}" ${picked.has(f.id) ? 'checked' : ''}
                aria-label="Select family ${esc(f.id)}"><span class="bx">${icon('check', 11)}</span></label></td>
              <td class="mono">${esc(f.id)}</td>
              <td>${esc(f.name)}</td>
              <td class="c-num mono">${f.articles.toLocaleString('en-US')}</td>
              <td>${esc(f.businessLine)}</td>
              <td>${esc(f.category)}</td>
              <td><span class="tone-chip"><span class="sw" style="background:var(${tone(f.competitiveness)})"></span>${esc(f.competitiveness)}</span></td>
              <td>${f.dfs ? 'Yes' : 'No'}</td>
              <td class="mono">${esc(f.supplier)}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>`
      : `<div class="empty"><span class="ei">${icon('search', 22)}</span>
           <h3>No families match</h3><p>Clear the search boxes to see the whole pool again.</p></div>`;
    renderFoot();
  };

  const renderFoot = () => {
    const foot = dlg.querySelector('#famFoot');
    const n = picked.size;
    const btn = (label, page, cur, dis) =>
      `<button class="pg${cur ? ' cur' : ''}" data-page="${page}"${dis ? ' disabled' : ''}${cur ? ' aria-current="page"' : ''}>${label}</button>`;
    let pages = '';
    if (res && res.pages > 1) {
      pages = btn(icon('chevLeft', 13), res.page - 1, false, res.page <= 1);
      for (let i = 1; i <= res.pages; i++) pages += btn(String(i), i, i === res.page, false);
      pages += btn(icon('chevRight', 13), res.page + 1, false, res.page >= res.pages);
    }
    foot.innerHTML = `
      <span class="count">${res && res.total
        ? `Showing <b class="mono">${res.from}</b> to <b class="mono">${res.to}</b> of <b class="mono">${res.total}</b>`
        : 'Nothing to show'}</span>
      <span class="pages">${pages}</span>
      <button class="btn btn-primary" id="famApply"${n ? '' : ' disabled'}>
        <span class="mono">${n}</span> Selected ${icon('chevRight', 15)}
      </button>`;
  };

  const load = async () => {
    res = await TwinXService.listFamilies(q);
    q.page = res.page;
    renderTable();
  };

  dlg.addEventListener('click', async e => {
    if (e.target.closest('[data-close]')) return closeTopDialog();

    if (e.target.closest('#famUploadBtn')) { mode = 'upload'; paintShell(); return; }
    if (e.target.closest('#famCancelUpload')) { mode = 'browse'; file = null; paintShell(); return; }

    if (e.target.closest('#famTemplate')) {
      toast('Family template download is queued. The real file comes from the TwinX export endpoint.', 'info');
      return;
    }

    const val = e.target.closest('#famValidate');
    if (val && !val.disabled) {
      upload = await TwinXService.uploadFamilyFile(file.name, [...picked]);
      upload.matched.forEach(id => picked.add(id));
      mode = 'validated';
      q = { byId: '', byName: '', page: 1, pageSize: 6 };
      await load();
      paintShell();
      return;
    }

    const pg = e.target.closest('[data-page]');
    if (pg && !pg.disabled) { q.page = Number(pg.dataset.page); load(); return; }
    if (e.target.closest('#famApply')) return apply();
  });

  dlg.addEventListener('change', e => {
    if (e.target.id === 'famFile') {
      file = (e.target.files && e.target.files[0]) || null;
      const nm = dlg.querySelector('#famName');
      if (nm) { nm.textContent = file ? file.name : 'No file chosen'; nm.classList.toggle('set', !!file); }
      const v = dlg.querySelector('#famValidate');
      if (v) v.disabled = !file;
      return;
    }
    if (e.target.id === 'famAll') {
      res.rows.forEach(f => e.target.checked ? picked.add(f.id) : picked.delete(f.id));
      renderTable(); return;
    }
    const pick = e.target.closest('[data-fam-pick]');
    if (pick) {
      const id = pick.dataset.famPick;
      pick.checked ? picked.add(id) : picked.delete(id);
      const tr = dlg.querySelector(`tr[data-fam="${id}"]`);
      if (tr) tr.classList.toggle('on', pick.checked);
      const all = dlg.querySelector('#famAll');
      if (all) all.checked = res.rows.length > 0 && res.rows.every(f => picked.has(f.id));
      renderFoot();
    }
  });

  let t = 0;
  dlg.addEventListener('input', e => {
    if (e.target.id !== 'famById' && e.target.id !== 'famByName') return;
    q.byId = dlg.querySelector('#famById').value;
    q.byName = dlg.querySelector('#famByName').value;
    q.page = 1;
    clearTimeout(t); t = setTimeout(load, 200);
  });

  const apply = async () => {
    const ids = [...picked];
    const rows = await TwinXService.getFamilies(ids);
    c.selection.families = ids;
    c.selection.skus = rows.reduce((n, f) => n + f.articles, 0);
    c.selection.rows = rows;
    closeTopDialog();
    renderConfig();
    await syncDraftFamilies();
    toast(`<b class="mono">${ids.length}</b> ${ids.length === 1 ? 'family' : 'families'} applied · <b class="mono">${c.selection.skus.toLocaleString('en-US')}</b> targeted SKUs.`);
  };

  (async () => { await load(); paintShell(); })();
}

/* =========================  POPOVERS  ==================================== */
function openFilterSelect(anchor, key, options, title) {
  const sel = state.pending[key];
  const n = openPop(anchor, `
    <div class="pop-head"><span class="ulabel">${esc(title)}</span></div>
    <div class="pop-list" role="listbox" aria-multiselectable="true">
      ${options.length ? options.map(o => `
        <button class="opt" role="option" data-opt="${esc(o.value)}" aria-selected="${sel.includes(o.value)}">
          <span class="cbx"><span class="bx${sel.includes(o.value) ? ' on' : ''}">${icon('check', 11)}</span></span>
          <span class="l">${esc(o.label)}</span><span class="n">${o.count}</span></button>`).join('')
        : '<p class="hint" style="padding:10px;margin:0">No options available.</p>'}
    </div>
    <div class="pop-foot">
      <button class="btn btn-ghost" data-act="clear">Clear</button>
      <button class="btn btn-ghost" data-act="done">Done</button>
    </div>`, { label: title });
  n.addEventListener('click', e => {
    const opt = e.target.closest('[data-opt]');
    if (opt) {
      const v = opt.dataset.opt, i = state.pending[key].indexOf(v);
      i === -1 ? state.pending[key].push(v) : state.pending[key].splice(i, 1);
      opt.setAttribute('aria-selected', i === -1);
      opt.querySelector('.bx').classList.toggle('on', i === -1);
      renderFilters();
      return;
    }
    const a = e.target.closest('[data-act]');
    if (!a) return;
    if (a.dataset.act === 'clear') { state.pending[key] = []; renderFilters(); }
    closePop();
  });
}
function openPeriod(anchor) {
  const p = state.pending;

      <div class="dr-row">

    state.pending.from = n.querySelector('#drFrom').value;

    </div>`, { label: 'Notifications', align: 'end' });
  n.style.minWidth = '330px'; place(n, anchor, 'end');
  n.addEventListener('click', e => {
    if (e.target.closest('[data-act="read"]')) { state.unread = 0; closePop(false); renderTopBar(); toast('All activity marked as read.'); return; }
    if (e.target.closest('[data-notif]')) { closePop(); toast('Opening the related experiment is part of the next workflow.', 'info'); }
  });
}
function openLang(anchor) {
  const cur = state.session.locale.current;
  const n = openPop(anchor, `<div class="pop-head"><span class="ulabel">Language</span></div>
    <div class="pop-list" role="listbox">${state.session.locale.available.map(l => `
      <button class="opt" role="option" data-lang="${esc(l)}" aria-selected="${l === cur}">
        <span class="l">${esc(l)}</span><span class="tk">${icon('check', 14)}</span></button>`).join('')}</div>`,
    { label: 'Language', align: 'end' });
  n.addEventListener('click', e => {
    const b = e.target.closest('[data-lang]'); if (!b) return;
    state.session.locale.current = b.dataset.lang;
    closePop(false); renderTopBar(); toast(`Interface language set to <b>${esc(b.dataset.lang)}</b>.`);
  });
}
function openUser(anchor) {
  const u = state.session.user;
  const n = openPop(anchor, `
    <div class="pop-who"><b>${esc(u.name)}</b><span>${esc(u.role)}</span></div>
    <div class="pop-sep"></div>
    <div class="pop-list">
      <button class="opt" data-user="profile"><span class="l">Profile</span></button>
      <button class="opt" data-user="prefs"><span class="l">Preferences</span></button>
      <div class="pop-sep"></div>
      <button class="opt" data-user="signout"><span class="l">Sign out</span></button>
    </div>`, { label: 'Account', align: 'end' });
  n.addEventListener('click', e => {
    if (!e.target.closest('[data-user]')) return;
    closePop(); toast('Account screens are outside this workspace prototype.', 'info');
  });
}
function openRowMenu(anchor, id) {
  const n = openPop(anchor, `<div class="pop-list">
      <button class="opt" data-row-act="view"><span class="l">View experiment</span></button>
      <button class="opt" data-row-act="copy"><span class="l">Copy experiment ID</span></button>
    </div>
    <p class="hint" style="padding:4px 10px 6px;margin:0">Further actions unlock once the experiment is configured.</p>`,
    { label: `Actions for experiment ${id}`, align: 'end' });
  n.addEventListener('click', async e => {
    const b = e.target.closest('[data-row-act]'); if (!b) return;
    closePop();
    if (b.dataset.rowAct === 'view') return openExperiment(id);
    try { await navigator.clipboard.writeText(String(id)); toast(`Experiment ID <span class="mono">${id}</span> copied.`); }
    catch (err) { toast(`Experiment ID <span class="mono">${id}</span>`, 'info'); }
  });
}

/* =========================  THEME  ======================================= */
function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'dark'; }
function setMeta(theme) {
  let m = document.querySelector('meta[name="theme-color"]');
  if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
  m.setAttribute('content', theme === 'light' ? '#F7F7F8' : '#08090A');
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';   // read the live attribute, never a cache
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('pt.theme', next); } catch (e) {}
  setMeta(next); renderTopBar();
}
function setAccent(id) {
  document.documentElement.setAttribute('data-accent', id);
  try { localStorage.setItem('pt.accent', id); } catch (e) {}
  renderTopBar();
}

/* =========================  EVENTS  ====================================== */
let searchTimer = null;

document.addEventListener('click', async e => {
  const t = e.target;
  if (pop) {
    if (pop.anchor && pop.anchor.contains(t)) { closePop(false); return; }
    if (!pop.node.contains(t)) closePop(false);
  }

  /* rail */
  if (t.closest('#railToggle')) {
    state.railPinned = !state.railPinned;
    el('rail').classList.toggle('is-pinned', state.railPinned);
    renderRail(); return;
  }
  if (t.closest('#burger')) { openRailDrawer(true); return; }
  if (t.closest('.rail-scrim')) { openRailDrawer(false); return; }
  const nav = t.closest('[data-nav]');
  if (nav) {
    const item = state.nav.flatMap(g => g.items).find(i => i.id === nav.dataset.nav);
    if (item && !item.active) toast(`<b>${esc(item.label)}</b> is not part of this release. The rail is built to take it.`, 'info');
    else if (item && item.id === 'reports') goReports();
    else if (item && item.id === 'experiments') goExperiments();
    if (innerWidth <= 768) openRailDrawer(false);
    return;
  }

  /* theme + accent */
  if (t.closest('#btnTheme')) return toggleTheme();
  const sw = t.closest('[data-accent-set]');
  if (sw) return setAccent(sw.dataset.accentSet);

  /* scope */
  const chip = t.closest('[data-scope-type]');
  if (chip) {
    const [sid, tid] = chip.dataset.scopeType.split(':');
    const arr = state.scopeSel[sid], i = arr.indexOf(tid);
    i === -1 ? arr.push(tid) : arr.splice(i, 1);
    state.page = 1; state.selection.clear();
    await refreshScopes(); await loadExperiments(); return;
  }
  const sc = t.closest('[data-scope-clear]');
  if (sc) {
    state.scopeSel[sc.dataset.scopeClear] = [];
    state.page = 1; state.selection.clear();
    await refreshScopes(); await loadExperiments(); return;
  }

  /* filters */
  if (t.closest('#fStatus')) return openFilterSelect(t.closest('#fStatus'), 'status', state.filterOptions.promotionStatus, 'Promotion Status');
  if (t.closest('#fRegion')) return openFilterSelect(t.closest('#fRegion'), 'region', state.filterOptions.region, 'Region');
  if (t.closest('#fFam'))    return openFilterSelect(t.closest('#fFam'), 'families', state.filterOptions.families, 'Involved Families');
  if (t.closest('#fPeriod')) return openPeriod(t.closest('#fPeriod'));
  if (t.closest('#fApply')) {
    state.filters = JSON.parse(JSON.stringify(state.pending));
    state.page = 1; state.selection.clear();
    renderFilters(); await loadExperiments();
    const n = countFilters(state.filters);
    toast(n ? `${plural(n, 'filter')} applied to the experiment list.` : 'All filters cleared.');
    return;
  }
  if (t.closest('#fReset')) {
    const b = t.closest('#fReset'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
    state.filters = emptyFilters(); state.pending = emptyFilters();
    state.page = 1; state.selection.clear();
    renderFilters(); await loadExperiments(); return;
  }
  if (t.closest('#fExport')) {
    await TwinXService.exportExperiments(query());
    toast(`Export queued · <span class="mono">${state.result.total}</span> entries from ${esc(currentProject().name)}.`);
    return;
  }

  /* projects */
  const proj = t.closest('[data-project]');
  if (proj) {
    if (proj.dataset.project === state.projectId) return;
    state.projectId = proj.dataset.project;
    state.page = 1; state.selection.clear();
    state.filters = emptyFilters(); state.pending = emptyFilters();
    state.filterOptions = await TwinXService.getFilterOptions(state.projectId);
    renderProjects(); renderFilters(); renderHead();
    await refreshScopes(); await loadExperiments(); return;
  }
  if (t.closest('#btnAddProject')) return openAddProject();

  /* lifecycle stage → status filter */
  const stage = t.closest('[data-stage]');
  if (stage) {
    const id = stage.dataset.stage, i = state.filters.status.indexOf(id);
    i === -1 ? state.filters.status.push(id) : state.filters.status.splice(i, 1);
    state.pending.status = [...state.filters.status];
    state.page = 1; state.selection.clear();
    renderFilters(); await loadExperiments(); return;
  }

  /* workspace */
  if (t.closest('#btnCreate')) return openNewPromotion();
  if (t.closest('#btnCompare')) return goCompare();
  if (t.closest('#searchClear')) { state.search = ''; state.page = 1; renderWork(); await loadExperiments(); return; }
  if (t.closest('#emptyReset')) {
    state.filters = emptyFilters(); state.pending = emptyFilters();
    state.scopeSel = { products: [], network: [] };
    state.search = ''; state.page = 1;
    renderFilters(); await refreshScopes(); await loadExperiments(); return;
  }

  const th = t.closest('[data-sort]');
  if (th) {
    const k = th.dataset.sort;
    state.sort = state.sort.key === k
      ? (state.sort.dir === 'asc' ? { key: k, dir: 'desc' } : { key: null, dir: 'asc' })
      : { key: k, dir: 'asc' };
    await loadExperiments();
    const again = document.querySelector(`[data-sort="${k}"]`);
    if (again) again.focus({ preventScroll: true });
    return;
  }

  if (dstack.length) return;   // row clicks below belong to the page, not a dialog

  const view = t.closest('[data-view]');
  if (view) return openExperiment(Number(view.dataset.view));
  const open = t.closest('[data-open]');
  if (open) {
    const [x] = await TwinXService.getExperiments([Number(open.dataset.open)]);
    if (x) continueExperiment(x);
    return;
  }
  const resBtn = t.closest('[data-results]');
  if (resBtn) return openSimResults(Number(resBtn.dataset.results));
  const more = t.closest('[data-more]');
  if (more) return openRowMenu(more, Number(more.dataset.more));

  const pg = t.closest('[data-page]');
  if (pg && !pg.disabled) { state.page = Number(pg.dataset.page); await loadExperiments(); return; }

  if (t.closest('#btnNotif')) return openNotifications(t.closest('#btnNotif'));
  if (t.closest('#btnLang'))  return openLang(t.closest('#btnLang'));
  if (t.closest('#btnUser'))  return openUser(t.closest('#btnUser'));
});

function openRailDrawer(on) {
  state.railOpen = on;
  el('rail').classList.toggle('is-open', on);
  const b = el('burger'); if (b) b.setAttribute('aria-expanded', String(on));
  let s = document.querySelector('.rail-scrim');
  if (on && !s) { s = document.createElement('div'); s.className = 'rail-scrim'; document.body.appendChild(s); }
  if (!on && s) s.remove();
}

document.addEventListener('change', async e => {
  const t = e.target;
  if (dstack.length && t.closest('.dlg')) return;   // dialogs handle their own controls
  if (t.id === 'selAll') {
    const rows = state.result ? state.result.rows : [];
    rows.forEach(r => t.checked ? state.selection.add(r.id) : state.selection.delete(r.id));
    renderWork(); return;
  }
  const pick = t.closest('[data-pick]');
  if (pick) {
    const id = Number(pick.dataset.pick);
    pick.checked ? state.selection.add(id) : state.selection.delete(id);
    renderWork(); return;
  }
  if (t.id === 'pageSize') { state.pageSize = Number(t.value); state.page = 1; await loadExperiments(); }
});

document.addEventListener('input', e => {
  if (e.target.id !== 'searchInput') return;
  state.search = e.target.value; state.page = 1;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.selection.clear(); loadExperiments(); }, 240);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (pop) { closePop(); return; }
    if (dstack.length) { closeTopDialog(); return; }   // innermost level only
    if (state.railOpen) { openRailDrawer(false); return; }
  }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !dstack.length) {
    const s = el('searchInput'); if (s) { e.preventDefault(); s.focus(); }
  }
});
addEventListener('resize', () => { if (pop && pop.anchor) place(pop.node, pop.anchor, 'start'); });

/* =========================  BOOT  ======================================== */
(async function boot() {
  setMeta(currentTheme());
  const [session, nav, scopes, statusReg, notifications, projects, simulationTypes, promotionTypes] = await Promise.all([
    TwinXService.getSession(), TwinXService.getNavigation(), TwinXService.getScopes(),
    TwinXService.getStatusRegistry(), TwinXService.getNotifications(), TwinXService.getProjects(),
    TwinXService.getSimulationTypes(), TwinXService.getPromotionTypes()
  ]);
  Object.assign(state, { session, nav, scopes, statusReg, notifications, projects, simulationTypes, promotionTypes });
  state.projectId = projects[0].id;
  state.unread = notifications.length;
  state.filterOptions = await TwinXService.getFilterOptions(state.projectId);
  state.scopeSummary = await TwinXService.getScopeSummary(state.projectId, state.scopeSel);
  state.result = await TwinXService.listExperiments(query());
  renderAll();
  wireConfig();
  wireValidation();
  wireReports();
  wireCompare();
  el('pagehead').addEventListener('click', e => {
    if (e.target.closest('[data-go-experiments]')) goExperiments();
    if (e.target.closest('#rpDownload'))
      toast('The report export endpoint is not connected yet.', 'info');
    if (e.target.closest('#cmpDownload'))
      toast('The comparison export endpoint is not connected yet.', 'info');
    if (e.target.closest('#cfExport'))
      toast('The export endpoint is not connected yet. The result stays on screen.', 'info');
  });
  el('pagehead').addEventListener('change', e => {
    const c = state.config;
    if (c && e.target.id === 'cfIteration') {
      c.values.iteration = Number(e.target.value);
      toast(`Showing <b>Iteration ${c.values.iteration}</b>. Earlier iterations arrive with the endpoint.`, 'info');
    }
  });
  TwinXService.endBoot();
})();
})();
</script>
