<script>
/* ==========================================================================
   LAYER 1 — MOCK DATA
   Everything the UI renders comes from here. Nothing is written into markup.
   Replace this module with API responses and the UI above is untouched.
   ========================================================================== */
/* Month names as the client writes them (April, not Apr). */
const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'April', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* Avalanche mix: family ids differ by one character, so a plain rolling hash
   leaves neighbouring families with near-identical figures. Both data layers
   derive their stable figures from it, so it sits at module scope. */
const seedOf = (str, salt) => {
  let h = salt >>> 0;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 2654435761) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 2246822507) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 3266489909) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
};

const TwinXData = (() => {

  const session = {
    platform: { name: 'TwinX', legal: 'TCS TwinX™', vendor: 'TCS' },
    client:   { name: 'Stellantis' },
    application: { code: 'Promotool', name: 'Promotion Optimization' },
    user: { name: 'MARCUS WEBER', role: 'Promotion Pilot (EE)', initials: 'MW' },
    locale: { current: 'English', available: ['English', 'Français', 'Italiano', 'Deutsch', 'Español'] }
  };

  const navigation = [
    { group: 'Workspace', items: [
      { id: 'experiments', label: 'Experiments', icon: 'experiments', active: true,  status: 'live' },
      { id: 'products',    label: 'Products',    icon: 'cube',        active: false, status: 'planned' },
      { id: 'network',     label: 'Network',     icon: 'network',     active: false, status: 'planned' }
    ]},
    { group: 'Intelligence', items: [
      { id: 'reports',   label: 'Reports',   icon: 'clipboard', active: true,  status: 'live' },
      { id: 'analytics', label: 'Analytics', icon: 'analytics', active: false, status: 'planned' },
      { id: 'insights',  label: 'Insights',  icon: 'insights',  active: false, status: 'planned' }
    ]},
    { group: 'Platform', items: [
      { id: 'administration', label: 'Administration', icon: 'admin', active: false, status: 'planned' }
    ]}
  ];

  const scopes = [
    { id: 'products', title: 'Products', icon: 'cube', typesLabel: 'Types',
      types: [
        { id: 'OE',        label: 'OE',        ramp: '--c1' },
        { id: 'EUROREPAR', label: 'EUROREPAR', ramp: '--c3' },
        { id: 'WSP',       label: 'WSP',       ramp: '--c5' }
      ] },
    { id: 'network', title: 'Network', icon: 'network', typesLabel: 'Types',
      types: [
        { id: 'NSCs',      label: 'NSCs',      ramp: '--c1' },
        { id: 'Importers', label: 'Importers', ramp: '--c5' }
      ] }
  ];

  /* --- experiment status system --------------------------------------
     `marker` is the form the state takes, not a colour: the spec's rule is
     that meaning has to survive pure monochrome. One entry per status —
     adding a sixth is an entry here and nothing else.
       solid      filled disc                      (running)
       check      filled disc with a knocked-out tick (finished)
       attention  filled accent disc, accent pill  (waiting on the user)
       ring       hollow ring, --fg-2              (queued)
       ring-mute  hollow ring, --fg-3              (not yet committed)     */
  const statuses = {
    draft: {
      id: 'draft', label: 'Draft', semanticType: 'neutral',
      marker: 'ring-mute', order: 1,
      hint: 'Being set up. Not yet committed to a plan.'
    },
    planned: {
      id: 'planned', label: 'Planned', semanticType: 'pending',
      marker: 'ring', order: 2,
      hint: 'Configured and scheduled, awaiting submission.'
    },
    submitted_logistics_review: {
      id: 'submitted_logistics_review', label: 'Submitted for Logistics Review',
      semanticType: 'attention', marker: 'attention', order: 3,
      hint: 'With logistics for review before execution.'
    },
    active: {
      id: 'active', label: 'Active', semanticType: 'running',
      marker: 'solid', order: 4,
      hint: 'Running in market.'
    },
    analysis_completed: {
      id: 'analysis_completed', label: 'Analysis Completed',
      semanticType: 'complete', marker: 'check', order: 5,
      hint: 'Executed and analysed. Results available.'
    }
  };
  const statusOrder = Object.values(statuses).sort((a, b) => a.order - b.order).map(s => s.id);

  /* --- simulation types (New Promotion dialog) ----------------------- */
  const simulationTypes = [
    { id: 'what-if', label: 'What-If', available: true },
    { id: 'if-what', label: 'If-What', available: false }
  ];

  /* --- promotion types -----------------------------------------------
     Seven types, each with its own downstream flow. `flow` is the route
     key the Create Promotion button hands to the flow router; `status`
     is 'available' once that flow exists. Only type 1 is built.
     Labels 2-7 are placeholders until the real wording is supplied, and
     type 1's label is the reference screenshot's, which is cut off in the
     shot at "with/witho…" — the tail still needs confirming.           */
  const promotionTypes = [
    { id: 'pt-1', order: 1, status: 'available',
      label: "Discount on MSRP at article level, for the NSC/ importer's, with/without threshold",
      short: 'Discount on MSRP \u2014 article level',
      applicableFor: ['PLPR', 'CSPS'],
      flow: 'discount-msrp-article' },
    { id: 'pt-2', order: 2, status: 'planned',
      label: "Discount on MSRP at family level, for the NSC/ importer's, with/without threshold",
      short: 'Discount on MSRP \u2014 family level', flow: 'discount-msrp-family' },
    { id: 'pt-3', order: 3, status: 'planned',
      label: 'Net Special Price (PNS), with/without thresholds',
      short: 'Net Special Price (PNS)', flow: 'net-special-price' },
    { id: 'pt-4', order: 4, status: 'planned',
      label: 'Free Quantity of Same Article, with/without thresholds',
      short: 'Free quantity \u2014 same article', flow: 'free-qty-same-article' },
    { id: 'pt-5', order: 5, status: 'planned',
      label: 'Free quantity of another article, with/without thresholds',
      short: 'Free quantity \u2014 another article', flow: 'free-qty-other-article' },
    { id: 'pt-6', order: 6, status: 'planned',
      label: 'Turnover Target of Same Part',
      short: 'Turnover target \u2014 same part', flow: 'turnover-target-same-part' }
  ];

  /* Article families — the pool the Select Family dialog pages through. */
  /* Articles under each family, with the exclusion record the drill-down shows.
     Derived from the family id so a family always yields the same articles. */
  /* The client's own month labelling for the trend strip. */
  const MONTH_LABELS = ["OCT '25", "NOV '25", "DEC '25", "JAN '25", "FEB '25", "MAR '25"];

  const ARTICLE_SEEDS = [
    { code: 'SUS', brand: 'FIA', brandName: 'Fiat',     part: 'Shock Absorber' },
    { code: 'FIL', brand: 'PEU', brandName: 'Peugeot',  part: 'Oil Filter' },
    { code: 'FLU', brand: 'CIT', brandName: 'Citroen',  part: 'Coolant G12+' },
    { code: 'BRK', brand: 'OPL', brandName: 'Opel',     part: 'Brake Pad Set' },
    { code: 'ELE', brand: 'DSA', brandName: 'DS',       part: 'Alternator' }
  ];

  const EXCLUSIONS = [
    { code: '8D', reason: 'Temporary inventory constraint - GLobal stockout', start: '2024-01-01', end: '2024-12-31' },
    { code: '9C', reason: 'Pending quality audit review',                     start: '2025-01-01', end: '2025-06-30' },
    { code: '8D', reason: 'Supplier contract renegotiation',                  start: '2025-03-01', end: '2025-05-31' },
    { code: '8D', reason: 'End of life cycle - No New promotions',            start: '2025-01-01', end: '2025-12-31' }
  ];

  const articlesFor = f => {
    const h = seedOf(f.id, 0x9e3779b1);
    const out = [];
    for (let i = 0; i < 10; i++) {
      const seed = ARTICLE_SEEDS[(h + i * 3) % ARTICLE_SEEDS.length];
      const gen = ((h >>> (i % 8)) % 18) + i + 1;
      const num = 1000 + ((h + i * 7) % 90) + i;
      const ex = i < 4 ? EXCLUSIONS[(h + i) % EXCLUSIONS.length] : null;
      const r = k => ((((h >>> (k % 24)) ^ ((i + 1) * 2654435761)) >>> 0) % 997) / 997;
      const dec = (lo, hi, k) => Math.round((lo + r(k) * (hi - lo)) * 10) / 10;
      const hist = dec(1.4, 9.4, 2);
      const demandForecast = Math.round(4 + r(6) * 26);
      const twinx = Math.round(demandForecast * (1.1 + r(9) * 2.2));
      const recommended = Math.round(twinx * (0.3 + r(12) * 0.4));
      const trend = MONTH_LABELS.map((label, m) => {
        const nonPromo = Math.round(3 + ((h >>> (m + 2)) + i * 5) % 7);
        const promo = (m === 1 || m === 2) ? Math.round(2 + ((h >>> m) + i) % 5) : 0;
        return { label, nonPromo, promo };
      });
      out.push({
        familyId: f.id,
        id: `ST-${seed.code}-${seed.brand}-${num}`,
        name: `${seed.brandName} ${seed.part} - Gen ${gen}`,
        exclusionCode: ex ? ex.code : null,
        exclusionReason: ex ? ex.reason : null,
        startDate: ex ? ex.start : null,
        endDate: ex ? ex.end : null,
        excluded: !!ex,
        volume: {
          hist, totalOrdered: dec(1.4, 9.4, 4), avgWithoutPromo: dec(1.2, 8.2, 7),
          avgWithPromo: dec(1.6, 9.9, 10), avgDuringPromo: dec(1.6, 9.9, 13),
          avgMonthlyDemand: dec(1.2, 8.8, 16),
          demandForecast, twinxForecast: twinx,
          confidence: r(18) > 0.45 ? Math.round(52 + r(21) * 44) : null,
          odmma: 50, promoVolumeTarget: demandForecast, recommendedTarget: recommended,
          trend
        },
        price: (() => {
          const sellingPrice = Math.round((4 + r(3) * 9) * 100) / 100;
          const marginPct = Math.round((58 + r(8) * 34) * 100) / 100;
          const conf = Math.round((0.08 + r(14) * 0.88) * 100) / 100;
          const level = conf >= 0.66 ? 'High' : conf >= 0.34 ? 'Medium' : 'Low';
          const tier = 1 + Math.floor(r(17) * 5);
          const sens = tier >= 5 ? 'Highly Sensitive' : tier <= 1 ? 'Low Sensitive' : 'Balanced';
          const thresholdMin = 8 + Math.round(r(20) * 10);
          return {
            sellingPrice, marginPct,
            discountRpa: 15,
            twinxRecommended: 8 + Math.round(r(11) * 14),
            elasticity: Math.round((r(5) > 0.8 ? 0.4 + r(2) * 1.2 : -(0.5 + r(2) * 1.6)) * 100) / 100,
            confidence: { level, value: conf },
            sensitivity: { label: `${sens} - Tier ${tier}`, tone: tier >= 5 ? 'bad' : tier <= 1 ? 'ok' : 'neutral' },
            thresholdQty: 15,
            thresholdMin, thresholdRecommended: thresholdMin + 6, thresholdMax: thresholdMin + 22
          };
        })()
      });
    }
    return out;
  };

  /* Per-family analytics. Derived from the family's own id and article count
     so the numbers are stable across renders; the real figures come from the
     TwinX analysis endpoint. */
  const familyAnalytics = f => {
    const h = seedOf(f.id, 0x85ebca6b);
    const r = n => ((h >>> (n % 24)) % 1000) / 1000;
    const excluded = Math.max(1, Math.round(f.articles * (0.02 + r(3) * 0.06)));
    const active = f.articles - excluded;
    const base = Math.round(f.articles * (60 + r(5) * 70));
    const withoutPromo = Math.round(base / 12 * (0.85 + r(7) * 0.2));
    const uplift = 1.18 + r(11) * 0.34;
    const withPromo = Math.round(withoutPromo * uplift);
    return {
      articlesActive: active, articlesExcluded: excluded,
      totalHistoricalQty: base,
      avgMonthlyWithoutPromo: withoutPromo,
      avgMonthlyWithPromo: withPromo,
      avgMonthlyDemand: withPromo,
      avgMarginEur: Math.round((4 + r(13) * 9) * 10) / 10,
      avgMarginPct: Math.round((62 + r(17) * 32) * 10) / 10,
      promoElasticity: -Math.round((0.6 + r(19) * 1.3) * 100) / 100
    };
  };

  const families = [
    { id: '1109Z5', name: 'Filter',     articles: 653,  businessLine: 'Body',       category: 'OEM',       competitiveness: 'High',    dfs: true,  supplier: 'PRO' },
    { id: '1109T0', name: 'A/C',        articles: 1235, businessLine: 'Body',       category: 'OEM',       competitiveness: 'High',    dfs: false, supplier: 'PRO' },
    { id: '1109Z1', name: 'Engine',     articles: 127,  businessLine: 'Body',       category: 'OEM',       competitiveness: 'Medium',  dfs: true,  supplier: 'IAM' },
    { id: '1109R6', name: 'Wiper',      articles: 80,   businessLine: 'Electrical', category: 'Retainera', competitiveness: 'Medium',  dfs: false, supplier: 'PRO' },
    { id: '1109N2', name: 'A/C',        articles: 426,  businessLine: 'Mechanical', category: 'Retainera', competitiveness: 'Captive', dfs: false, supplier: 'LOC' },
    { id: '1109AZ', name: 'Filter',     articles: 28,   businessLine: 'Body',       category: 'OEM',       competitiveness: 'High',    dfs: false, supplier: 'LOC' },
    { id: '1109B4', name: 'Brake',      articles: 512,  businessLine: 'Mechanical', category: 'OEM',       competitiveness: 'High',    dfs: true,  supplier: 'PRO' },
    { id: '1109C7', name: 'Clutch',     articles: 214,  businessLine: 'Mechanical', category: 'OEM',       competitiveness: 'Medium',  dfs: false, supplier: 'IAM' },
    { id: '1109D2', name: 'Battery',    articles: 96,   businessLine: 'Electrical', category: 'Retainera', competitiveness: 'Captive', dfs: true,  supplier: 'LOC' },
    { id: '1109E9', name: 'Suspension', articles: 348,  businessLine: 'Mechanical', category: 'OEM',       competitiveness: 'Medium',  dfs: false, supplier: 'PRO' },
    { id: '1109F1', name: 'Lighting',   articles: 175,  businessLine: 'Electrical', category: 'OEM',       competitiveness: 'High',    dfs: false, supplier: 'IAM' },
    { id: '1109G6', name: 'Engine',     articles: 804,  businessLine: 'Mechanical', category: 'Retainera', competitiveness: 'High',    dfs: true,  supplier: 'PRO' },
    { id: '1109H3', name: 'Wiper',      articles: 61,   businessLine: 'Electrical', category: 'OEM',       competitiveness: 'Captive', dfs: false, supplier: 'LOC' },
    { id: '1109J8', name: 'Filter',     articles: 289,  businessLine: 'Body',       category: 'Retainera', competitiveness: 'Medium',  dfs: true,  supplier: 'IAM' },
    { id: '1109K5', name: 'Brake',      articles: 143,  businessLine: 'Body',       category: 'OEM',       competitiveness: 'High',    dfs: false, supplier: 'PRO' }
  ].map(f => ({ ...f, analytics: familyAnalytics(f) }));
  families.forEach(f => { f.articles_list = articlesFor(f); });



  /* Markets, brands and promo applicability for the configuration step.
     Placeholder lists until the client's own reference data is wired in. */
  const markets = [
    'France', 'Germany', 'Italy', 'Spain', 'United Kingdom',
    'Belgium', 'Netherlands', 'Poland', 'Portugal', 'Austria'
  ].map(n => ({ id: n.toLowerCase().replace(/\s+/g, '-'), label: n }));

  const brands = [
    'Peugeot', 'Citro\u00ebn', 'DS Automobiles', 'Opel', 'Vauxhall',
    'Fiat', 'Abarth', 'Alfa Romeo', 'Lancia', 'Jeep', 'Maserati'
  ].map(n => ({ id: n.toLowerCase().replace(/\s+/g, '-'), label: n }));

  const promoApplicability = [
    { id: 'xP', label: 'xP', hint: 'Applies per part' },
    { id: 'xF', label: 'xF', hint: 'Applies per family' }
  ];

  const projects = [
    { id: 'p-nov-2025', name: 'Nov 2025_Promo', modified: 'Sat, 23 Nov, 2025 11:03 AM', locked: true },
    { id: 'p-oct-2025', name: 'Oct 2025_Promo', modified: 'Sat, 23 Oct, 2025 11:03 AM', locked: true }
  ];

  const NAMES = ['Thanks-giving Promotion', 'Holiday Promotion', 'February Promotion', 'Demo-shipmentOpt'];
  const FAMILY_SIZES = [10, 15, 20];
  const REGION = 'Europe';

  const referenceRows = [
    { id: 2724, name: 'Thanks-giving Promotion', status: 'draft',                      families: 10, iteration: 1 },
    { id: 2705, name: 'Holiday Promotion',       status: 'planned',                    families: 15, iteration: 1 },
    { id: 2701, name: 'February Promotion',      status: 'submitted_logistics_review', families: 20, iteration: 1 },
    { id: 2698, name: 'Demo-shipmentOpt',        status: 'active',                     families: 15, iteration: 1 },
    { id: 2699, name: 'Demo-shipmentOpt',        status: 'analysis_completed',         families: 20, iteration: 1 }
  ].map((r, i) => ({
    ...r, seq: i, projectId: 'p-nov-2025', region: REGION,
    startDate: '2025-03-20', endDate: '2025-03-20',
    productTypes: ['OE', 'EUROREPAR', 'WSP'].slice(0, (i % 3) + 1),
    networkTypes: i % 2 === 0 ? ['NSCs', 'Importers'] : ['NSCs'],
    iterationsTotal: 1
  }));

  let seed = 20250320;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const pad = n => String(n).padStart(2, '0');

  function generate(projectId, count, startId, startSeq) {
    const rows = [];
    let id = startId;
    const used = new Set(referenceRows.map(r => r.id));
    for (let i = 0; i < count; i++) {
      while (used.has(id)) id--;
      used.add(id);
      const m = 1 + Math.floor(rnd() * 12);
      const d = 1 + Math.floor(rnd() * 27);
      const len = 7 + Math.floor(rnd() * 45);
      const s = new Date(Date.UTC(2025, m - 1, d));
      const e = new Date(s.getTime() + len * 86400000);
      const iterTotal = 1 + Math.floor(rnd() * 3);
      const pt = ['OE', 'EUROREPAR', 'WSP'].filter(() => rnd() > 0.32);
      const nt = ['NSCs', 'Importers'].filter(() => rnd() > 0.35);
      rows.push({
        id: id--, seq: startSeq + i, projectId,
        name: pick(NAMES), region: REGION,
        startDate: `${s.getUTCFullYear()}-${pad(s.getUTCMonth() + 1)}-${pad(s.getUTCDate())}`,
        endDate:   `${e.getUTCFullYear()}-${pad(e.getUTCMonth() + 1)}-${pad(e.getUTCDate())}`,
        families: pick(FAMILY_SIZES),
        status: pick(statusOrder),
        iteration: iterTotal, iterationsTotal: iterTotal,
        productTypes: pt.length ? pt : ['OE'],
        networkTypes: nt.length ? nt : ['NSCs']
      });
    }
    return rows;
  }

  const experiments = [
    ...referenceRows,
    ...generate('p-nov-2025', 595, 2723, 5),
    ...generate('p-oct-2025', 348, 2124, 0)
  ];

  /* Every row carries the markets it runs in, so the Report Hub can filter on
     them. Derived from the id where the reference rows do not name them. */
  experiments.forEach(e => {
    if (e.markets && e.markets.length) return;
    const h = seedOf(String(e.id), 0xc2b2ae35);
    const a = markets[h % markets.length];
    const b2 = markets[(h >>> 7) % markets.length];
    e.markets = a.id === b2.id ? [a.id] : [a.id, b2.id];
  });

  const notifications = [
    { id: 'n1', status: 'submitted_logistics_review', text: '<b>February Promotion</b> (2701) was submitted for logistics review.', when: '12 min ago' },
    { id: 'n2', status: 'analysis_completed',         text: 'Analysis completed for <b>Demo-shipmentOpt</b> (2699).',              when: '1 hr ago' },
    { id: 'n3', status: 'active',                     text: '<b>Demo-shipmentOpt</b> (2698) is now active in market.',             when: '3 hrs ago' },
    { id: 'n4', status: 'planned',                    text: '<b>Holiday Promotion</b> (2705) moved to planned.',                   when: 'Yesterday' },
    { id: 'n5', status: 'draft',                      text: '<b>Thanks-giving Promotion</b> (2724) draft created in Nov 2025_Promo.', when: 'Yesterday' }
  ];

  return { session, navigation, scopes, statuses, statusOrder, simulationTypes, promotionTypes, markets, brands, promoApplicability, families, projects, experiments, notifications, REGION, FAMILY_SIZES };
})();


/* ==========================================================================
   LAYER 2 — SERVICE LAYER
   The UI only ever talks to TwinXService. Every method is async and returns
   the shape the real endpoint will return, so swapping `transport` from
   `mockTransport` to an HTTP client is the whole integration.
   ========================================================================== */
const TwinXService = (() => {

  let booting = true;                      // no simulated latency on first paint
  const settle = value => new Promise(res => {
    if (booting) return res(value);
    setTimeout(() => res(value), 170 + Math.random() * 110);
  });
  const toTime = iso => new Date(iso + 'T00:00:00Z').getTime();

  /* The financial model behind both the simulation result page and the
     experiment compare page: every row derives from volume through a unit
     price, a margin rate and a variable-cost rate. One definition, so the two
     screens can never disagree. Replace with the simulation endpoint. */
  const PROMO_MODEL = { unitPrice: 9.802, marginRate: 0.84281, varRate: 0.15038, fixed: 10 };
  const promoColumn = v => {
    const k = n => Math.round(n) / 1000;
    const turnover = v * PROMO_MODEL.unitPrice;
    const commercial = turnover * PROMO_MODEL.marginRate;
    const varMeans = turnover * PROMO_MODEL.varRate;
    const varMargin = commercial - varMeans;
    return { volume: v, turnover: k(turnover), commercial: k(commercial),
             varMeans: k(varMeans), varMargin: k(varMargin),
             fixed: PROMO_MODEL.fixed, gross: k(varMargin) - PROMO_MODEL.fixed };
  };

  /* The metric rows both screens list, in the client's own wording. */
  const METRIC_ROWS = [
    { label: 'Volume', key: 'volume', fmt: 'int' },
    { label: 'Turnover in k\u20ac', key: 'turnover', fmt: 'k' },
    { label: 'Commercial margin in k\u20ac', key: 'commercial', fmt: 'k' },
    { label: 'Variable commercial means in k\u20ac', key: 'varMeans', fmt: 'k' },
    { label: 'Variable margin in k\u20ac', key: 'varMargin', fmt: 'k' },
    { label: 'Fixed commercial means in k\u20ac', key: 'fixed', fmt: 'k' },
    { label: 'Gross Operational result after dispatch\u2026', key: 'gross', fmt: 'k' }
  ];

  /* A 0 means the endpoint returns no figure for that column and the cell
     prints an em dash, exactly as the client's mocks do. The result page
     carries six columns, the compare page two per promotion. */
  const METRIC_MASK = {
    sim: { volume: [1, 1, 1, 1, 1, 1], turnover: [1, 1, 1, 1, 1, 1], commercial: [1, 1, 1, 1, 1, 1],
           varMeans: [1, 1, 1, 1, 1, 1], varMargin: [1, 0, 1, 1, 1, 1],
           fixed: [0, 1, 0, 0, 0, 1], gross: [0, 1, 0, 0, 0, 1] },
    compare: { volume: [1, 1], turnover: [1, 1], commercial: [1, 1], varMeans: [1, 1],
               varMargin: [1, 0], fixed: [0, 1], gross: [0, 1] }
  };
  const maskRows = (which, cols) => METRIC_ROWS.map(r => {
    const mask = METRIC_MASK[which][r.key];
    return {
      label: r.label, key: r.key, fmt: r.fmt,
      cells: cols.map((c, i) => (c && mask[i % mask.length] ? c[r.key] : null))
    };
  });

  const mockTransport = {
    session:   () => TwinXData.session,
    nav:       () => TwinXData.navigation,
    scopes:    () => TwinXData.scopes,
    statuses:  () => ({ byId: TwinXData.statuses, order: TwinXData.statusOrder }),
    notifications: () => TwinXData.notifications,
    simulationTypes: () => TwinXData.simulationTypes,
    markets: () => TwinXData.markets,
    brands: () => TwinXData.brands,
    promoApplicability: () => TwinXData.promoApplicability,
    nextExperimentId: () => Math.max(...TwinXData.experiments.map(e => e.id)) + 1,

    /* Server-shaped: the dialog never sees the whole pool. */
    families(q = {}) {
      const byId = (q.byId || '').trim().toLowerCase();
      const byName = (q.byName || '').trim().toLowerCase();
      let rows = TwinXData.families;
      if (byId) rows = rows.filter(f => f.id.toLowerCase().includes(byId));
      if (byName) rows = rows.filter(f => f.name.toLowerCase().includes(byName));
      const pageSize = q.pageSize || 6;
      const total = rows.length;
      const pages = Math.max(1, Math.ceil(total / pageSize));
      const page = Math.min(Math.max(1, q.page || 1), pages);
      const from = (page - 1) * pageSize;
      return { rows: rows.slice(from, from + pageSize), total, page, pages, pageSize,
               from: total ? from + 1 : 0, to: Math.min(from + pageSize, total),
               allIds: rows.map(f => f.id) };
    },

    /* Simulation. The financial model is the one the client's own figures imply:
       every row derives from volume through a unit price, a margin rate and a
       variable-cost rate. Replace with the simulation endpoint. */
    simulate(payload) {
      const fams = (payload.familyIds || []).map(id => TwinXData.families.find(f => f.id === id)).filter(Boolean);
      const arts = fams.flatMap(f => f.articles_list);

      const breakeven = Math.max(1, arts.reduce((n, a) => n + Math.round(a.volume.demandForecast * 180), 0));
      const userUplift = Math.round(breakeven * 1.64);
      const twinxUplift = Math.round(breakeven * 1.38);

      const cols = [promoColumn(breakeven), promoColumn(breakeven), promoColumn(userUplift),
                    promoColumn(breakeven), promoColumn(breakeven), promoColumn(twinxUplift)];
      const rows = maskRows('sim', cols);

      /* Unit margin is money per unit over the promoted run; the factor is the
         mock's stand-in for the run length the endpoint will supply. */
      const unitMarginOf = a => Math.round(a.price.sellingPrice * a.price.marginPct * 1950) / 100;

      const scored = arts.map(a => ({
        id: a.id, name: a.name,
        unitMargin: unitMarginOf(a),
        uplift: Math.round(a.volume.twinxForecast * a.volume.demandForecast * 7.4)
      })).sort((x, y) => y.uplift - x.uplift);

      const r2 = n => Math.round(n * 100) / 100;

      /* Each family row is the roll-up of its own article rows, so the
         drilldown adds up when it is expanded. */
      const drilldown = fams.map(f => {
        const articles = f.articles_list.slice(0, 4).map(a => {
          const targetVolume = a.volume.promoVolumeTarget * 40;
          const discountEur = r2(a.price.sellingPrice * a.price.discountRpa / 100);
          return {
            id: a.id, name: a.name, level: 'article',
            discountPct: a.price.discountRpa,
            discountEur,
            totalDiscount: r2(discountEur * targetVolume),
            targetVolume,
            unitMargin: unitMarginOf(a),
            upliftVsBreakeven: Math.round(a.volume.demandForecast * 15),
            elasticity: a.price.elasticity,
            flagged: false
          };
        });
        const sum = k => articles.reduce((n, a) => n + a[k], 0);
        const volume = sum('targetVolume') || 1;
        const wavg = k => articles.reduce((n, a) => n + a[k] * a.targetVolume, 0) / volume;
        return {
          id: f.id, name: f.name, level: 'family',
          discountPct: Math.round(wavg('discountPct') * 10) / 10,
          discountEur: r2(wavg('discountEur')),
          totalDiscount: r2(sum('totalDiscount')),
          targetVolume: volume,
          unitMargin: r2(wavg('unitMargin')),
          upliftVsBreakeven: sum('upliftVsBreakeven'),
          elasticity: f.analytics.promoElasticity,
          flagged: false,
          articles
        };
      });

      /* Placeholder band: the family carrying the highest unit margin in the
         selection is flagged for review. The real band comes from the endpoint. */
      if (drilldown.length > 1) {
        drilldown.reduce((best, d) => (d.unitMargin > best.unitMargin ? d : best)).flagged = true;
      }

      /* Before / after use the same discount-to-margin relation as the Price
         Analysis tab, so the two screens agree. */
      const n = arts.length || 1;
      const avg = fn => arts.reduce((t, a) => t + fn(a), 0) / n;
      const mBefore = avg(a => a.price.marginPct);
      const mAfter = avg(a => {
        const d = a.price.discountRpa / 100, m = a.price.marginPct / 100;
        return (1 - (1 - m) / (1 - d)) * 100;
      });
      const uBefore = avg(a => a.price.sellingPrice * a.price.marginPct / 100);
      const uAfter = avg(a => a.price.sellingPrice * (a.price.marginPct / 100 - a.price.discountRpa / 100));
      const d1 = x => Math.round(x * 10) / 10;
      return {
        context: payload.context,
        summary: {
          unitMargin: { before: d1(uBefore), after: d1(uAfter) },
          marginPct: { before: d1(mBefore), after: d1(mAfter) },
          totalDiscount: r2(drilldown.reduce((n, d) => n + d.totalDiscount, 0)),
          salesQuantity: drilldown.reduce((n, d) => n + d.targetVolume, 0)
        },
        comparison: {
          user:  { avgDiscount: 10, volumeTarget: 35000 },
          twinx: { avgDiscount: 15, volumeTarget: 55000 },
          rows
        },
        drilldown,
        top: scored.slice(0, 3),
        low: scored.slice(-3)
      };
    },

    /* ---- Experiment compare -------------------------------------------
       Lines the ticked promotions up side by side: their configuration, the
       families they touch, and the same metric rows the result page shows,
       one pair of columns per promotion. */
    compare(q = {}) {
      const rows = (q.ids || []).map(id => TwinXData.experiments.find(e => e.id === id)).filter(Boolean);
      const mkt = Object.fromEntries(TwinXData.markets.map(m => [m.id, m.label]));
      const typeOf = Object.fromEntries(TwinXData.promotionTypes.map(t => [t.id, t.short]));

      const span = (a, b) => {
        const s0 = Date.parse(a + 'T00:00:00Z'), e0 = Date.parse(b + 'T00:00:00Z');
        if (isNaN(s0) || isNaN(e0) || e0 < s0) return '\u2026';
        const days = Math.round((e0 - s0) / 864e5) + 1;
        return days >= 14 ? `${Math.round(days / 7)} weeks` : days === 1 ? '1 day' : `${days} days`;
      };
      const dmy = iso => { const [y, m, d] = String(iso).split('-'); return `${d}/${m}/${y}`; };

      /* Seeded rows carry no family list, so a stable one is derived from the
         promotion id and the page has something to line up. Promotions
         configured in this session carry their own. */
      const famsFor = e => {
        if (e.familyIds && e.familyIds.length)
          return e.familyIds.map(id => TwinXData.families.find(f => f.id === id)).filter(Boolean);
        const h = seedOf(String(e.id), 0x27d4eb2f);
        const want = Math.max(1, Math.min(4, e.families || 2));
        const out = [];
        for (let i = 0; out.length < want && i < 24; i++) {
          const f = TwinXData.families[(h >>> i) % TwinXData.families.length];
          if (!out.includes(f)) out.push(f);
        }
        return out;
      };

      const promos = rows.map(e => ({
        id: e.id, name: e.name,
        iteration: e.iteration, iterationsTotal: e.iterationsTotal,
        type: typeOf[e.promotionType || 'pt-1'] || typeOf['pt-1'],
        markets: e.allMarkets ? 'All markets'
          : ((e.markets || []).map(m => mkt[m]).filter(Boolean).join(', ') || '\u2014'),
        duration: `${span(e.startDate, e.endDate)} (${dmy(e.startDate)} - ${dmy(e.endDate)})`,
        familyIds: famsFor(e).map(f => f.id)
      }));

      /* Each promotion runs its own volumes and its own discount, so the same
         family reads differently under each one. The factor stands in for the
         configuration the endpoint will supply. */
      const factorOf = (promoId, familyId) =>
        0.85 + ((seedOf(familyId + ':' + promoId, 0x1b873593) >>> 8) % 1000) / 1000 * 0.4;

      const applied = { familyId: q.familyId || '', articleId: q.articleId || '' };
      const inScope = p => {
        let fams = p.familyIds.map(id => TwinXData.families.find(f => f.id === id)).filter(Boolean);
        if (applied.familyId) fams = fams.filter(f => f.id === applied.familyId);
        let arts = fams.flatMap(f => f.articles_list);
        if (applied.articleId) arts = arts.filter(a => a.id === applied.articleId);
        return arts;
      };

      /* Two columns per promotion: the break-even run and the objective run. */
      const cols = [];
      promos.forEach(p => {
        const arts = inScope(p);
        if (!arts.length) { cols.push(null, null); return; }
        const f = factorOf(p.id, 'volume');
        const breakeven = Math.max(1, Math.round(
          arts.reduce((n, a) => n + a.volume.demandForecast * 180, 0) * f));
        cols.push(promoColumn(breakeven), promoColumn(Math.round(breakeven * 1.64)));
      });
      const metrics = maskRows('compare', cols);

      const ids = [];
      promos.forEach(p => p.familyIds.forEach(id => { if (!ids.includes(id)) ids.push(id); }));
      const families = ids.map(id => {
        const f = TwinXData.families.find(x => x.id === id);
        return {
          id: f.id, name: f.name, competitiveness: f.competitiveness, articles: f.articles,
          stats: promos.map(p => {
            if (!p.familyIds.includes(f.id)) return null;
            const arts = f.articles_list.slice(0, 4);
            const k = factorOf(p.id, f.id);
            const volume = Math.round(arts.reduce((n, a) => n + a.volume.promoVolumeTarget * 40, 0) * k);
            const discount = arts.reduce((n, a) => n + a.price.discountRpa, 0) / arts.length * k;
            const unit = arts.reduce((n, a) => n + a.price.sellingPrice * a.price.marginPct * 1950 / 100, 0) / arts.length;
            const r2 = n => Math.round(n * 100) / 100;
            return {
              promoId: p.id,
              discountPct: Math.round(discount * 10) / 10,
              targetVolume: volume,
              totalDiscount: r2(volume * discount / 100 * PROMO_MODEL.unitPrice),
              unitMargin: r2(unit * (1 - discount / 100))
            };
          })
        };
      });

      /* The article list follows the family the picker is on, which is not
         yet the applied filter until Apply is pressed. */
      const optionsFamily = q.optionsFamilyId || applied.familyId;
      const of = optionsFamily && TwinXData.families.find(f => f.id === optionsFamily);
      return {
        promos, families, metrics, applied,
        familyOptions: families.map(f => ({ id: f.id, label: `${f.id} - ${f.name}` })),
        articleOptions: of ? of.articles_list.map(a => ({ id: a.id, label: `${a.id} \u2014 ${a.name}` })) : []
      };
    },

    /* ---- Report Hub ---------------------------------------------------- */
    reportHub(q = {}) {
      const rows = TwinXData.experiments.filter(e =>
        (!q.projectId || e.projectId === q.projectId) &&
        (!q.market || (e.markets || []).includes(q.market)) &&
        (!q.status || e.status === q.status));

      const STAGES = [
        { id: 'draft',                       label: 'Created /Draft',    icon: 'pencil',      tone: 'muted' },
        { id: 'submitted_logistics_review',  label: 'Pending Approval',  icon: 'clock',       tone: 'warn' },
        { id: 'planned',                     label: 'Planned / Approved',icon: 'checkbox',    tone: 'accent' },
        { id: 'active',                      label: 'Active Currently',  icon: 'trend',       tone: 'twinx' },
        { id: 'analysis_completed',          label: 'Completed',         icon: 'checkCircle', tone: 'ok' }
      ].map(st => ({ ...st, count: rows.filter(r => r.status === st.id).length }));

      const live = rows.filter(r => r.status === 'active' || r.status === 'analysis_completed');

      /* Every figure is derived from the rows in view, so the filter bar moves
         the whole page together. */
      const track = live.map(r => {
        let h = 0;
        const seed = String(r.id) + r.name;
        for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 2654435761) >>> 0;
        const rr = k => ((h >>> (k % 24)) % 1000) / 1000;
        const intakeVol = 500 + Math.round(rr(3) * 60) * 50;
        const intakeRev = intakeVol * (40 + Math.round(rr(7) * 20));
        const volRatio = 0.6 + rr(11) * 0.75;
        const revRatio = 0.6 + rr(15) * 0.75;
        return {
          id: r.id, name: r.name, status: r.status,
          markets: (r.markets || []).slice(0, 2)
            .map(m => (TwinXData.markets.find(x => x.id === m) || { label: m }).label),
          intakeVol, salesVol: Math.round(intakeVol * volRatio),
          intakeRev, salesRev: Math.round(intakeRev * revRatio)
        };
      });

      const plannedRevenue = track.reduce((n, t) => n + t.intakeRev, 0);
      const registeredRevenue = track.reduce((n, t) => n + t.salesRev, 0);
      const plannedVol = track.reduce((n, t) => n + t.intakeVol, 0);
      const currentVol = track.reduce((n, t) => n + t.salesVol, 0);

      const page = Math.max(1, q.page || 1), pageSize = q.pageSize || 4;
      const pages = Math.max(1, Math.ceil(track.length / pageSize));

      return {
        stages: STAGES,
        pipelineTotal: rows.length,
        liveCount: live.length,
        performance: {
          plannedRevenue, registeredRevenue,
          estimatedCost: Math.round(plannedRevenue * 0.187),
          uplift: { breakeven: Math.round(plannedVol * 0.4), current: currentVol, planned: plannedVol }
        },
        tracking: {
          rows: track.slice((page - 1) * pageSize, page * pageSize),
          total: track.length, page: Math.min(page, pages), pages
        }
      };
    },

    /* Price elasticity: two demand curves that flatten once a discount stops
       buying extra volume. The endpoint will supply the real fit. */
    elasticity(q = {}) {
      const build = (eLow, eHigh, cap) => {
        const pts = [];
        for (let x = -40; x <= 20; x += 2) {
          const v = x <= 0 ? Math.min(cap, -eLow * x) : -eHigh * x;
          pts.push({ x, v: Math.round(v * 10) / 10 });
        }
        return pts;
      };
      const markets = [
        { market: 'Germany', volume: 7200, organic: -2.85, promo: -1.95, saturates: -15 },
        { market: 'France',  volume: 6100, organic: -2.70, promo: -1.85, saturates: -15 },
        { market: 'Italy',   volume: 3400, organic: -1.95, promo: -1.30, saturates: -14 }
      ].map(r => ({
        ...r,
        delta: Math.round((r.organic - r.promo) * 100) / 100,
        sensitivity: r.organic < -3 ? 'High' : r.organic <= -1.5 ? 'Medium' : 'Low'
      }));
      if (q.sort && q.sort.key) {
        const k = q.sort.key, dir = q.sort.dir === 'desc' ? -1 : 1;
        markets.sort((a, b) => (typeof a[k] === 'string' ? a[k].localeCompare(b[k]) : a[k] - b[k]) * dir);
      }
      return {
        article: { code: 'OF-10492', name: 'Oil Filter Spin-On' },
        organic: build(1.35, 1.65, 33),
        promo: build(0.875, 1.3, 21),
        flattenTo: -22,
        saturation: { x: -15, label: 'Saturation -15%' },
        markets,
        rule: 'High: steeper than -3.0 | Medium: -1.5 to -3.0 | Low: flatter than -1.5'
      };
    },

    /* Pre-order volume split: one row per family, each with its own article
       rows, spread over the months the logistics team pre-orders across. */
    volumeSplit(payload) {
      const months = payload.months || 10;
      const start = new Date((payload.startDate || '2026-04-01') + 'T00:00:00Z');
      const cols = Array.from({ length: months }, (_, i) => {
        const d = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i, 1));
        return {
          id: `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`,
          label: `${MONTH_NAMES[d.getUTCMonth()]} '${String(d.getUTCFullYear()).slice(2)}`
        };
      });

      const fams = (payload.familyIds || []).map(id => TwinXData.families.find(f => f.id === id)).filter(Boolean);

      /* A row's split is derived from its id so it is stable across renders;
         the recommendation is the endpoint's, the entered values start on it. */
      const splitFor = seed => {
        let h = 0;
        for (let i = 0; i < seed.length; i++) h = (h * 33 + seed.charCodeAt(i)) >>> 0;
        const raw = cols.map((c, i) => 4 + (((h >>> (i % 20)) ^ ((i + 3) * 2654435761)) >>> 0) % 28);
        const sum = raw.reduce((a, b) => a + b, 0);
        const rec = raw.map(v => Math.round(v / sum * 1000) / 10);
        rec[0] = Math.round((rec[0] + (100 - rec.reduce((a, b) => a + b, 0))) * 10) / 10;
        return { rec, entered: rec.slice() };
      };

      const rows = fams.map(f => {
        const articles = f.articles_list.slice(0, 3).map(a => ({
          id: a.id, kind: 'Article', name: a.name, familyId: f.id,
          totalVolume: a.volume.promoVolumeTarget * 1500, ...splitFor(a.id)
        }));
        return {
          id: f.id, kind: 'Family', name: f.name,
          totalVolume: articles.reduce((n, a) => n + a.totalVolume, 0),
          ...splitFor(f.id), articles
        };
      });

      return { months: cols, skus: rows.reduce((n, r) => n + r.articles.length, 0), rows };
    },

    periods: () => ([
      { id: '3m', label: 'Last 3 months', months: 3, short: 'Last 3M' },
      { id: '6m', label: 'Last 6 months', months: 6, short: 'Last 6M' },
      { id: '12m', label: 'Last 12 months', months: 12, short: 'Last 12M' }
    ]),

    articles(q = {}) {
      const fam = TwinXData.families.find(f => f.id === q.familyId);
      let rows = fam ? fam.articles_list : [];
      const term = (q.search || '').trim().toLowerCase();
      if (term) rows = rows.filter(a =>
        a.id.toLowerCase().includes(term) || a.name.toLowerCase().includes(term) ||
        (a.exclusionReason || '').toLowerCase().includes(term) ||
        (a.exclusionCode || '').toLowerCase().includes(term));
      const pageSize = q.pageSize || 4;
      const total = rows.length;
      const pages = Math.max(1, Math.ceil(total / pageSize));
      const page = Math.min(Math.max(1, q.page || 1), pages);
      const from = (page - 1) * pageSize;
      const months = q.months || 3;
      const page_rows = rows.slice(from, from + pageSize).map(a => months === 3 ? a
        : { ...a, volume: { ...a.volume, hist: Math.round(a.volume.hist * (months / 3) * 10) / 10 } });
      return { rows: page_rows, total, page, pages, pageSize,
               from: total ? from + 1 : 0, to: Math.min(from + pageSize, total) };
    },

    familiesByIds(ids) {
      return ids.map(id => TwinXData.families.find(f => f.id === id)).filter(Boolean);
    },

    /* Mock of the upload-matching endpoint: no spreadsheet is parsed here. */
    matchFamilyUpload(fileName, excludeIds = []) {
      const hit = TwinXData.families.find(f => !excludeIds.includes(f.id)) || TwinXData.families[0];
      return { fileName, matched: [hit.id], articles: hit.articles, notFound: 3 };
    },
    promotionTypes: () => TwinXData.promotionTypes,

    projects() {
      return TwinXData.projects.map(p => ({
        ...p,
        experimentCount: TwinXData.experiments.filter(e => e.projectId === p.id).length
      }));
    },

    filterOptions(projectId) {
      const rows = TwinXData.experiments.filter(e => e.projectId === projectId);
      const families = [...new Set(rows.map(r => r.families))].sort((a, b) => a - b);
      return {
        promotionStatus: TwinXData.statusOrder.map(id => ({
          value: id, label: TwinXData.statuses[id].label,
          count: rows.filter(r => r.status === id).length
        })),
        region: [...new Set(rows.map(r => r.region))].map(r => ({
          value: r, label: r, count: rows.filter(x => x.region === r).length
        })),
        families: families.map(f => ({
          value: String(f), label: `${f} families`, count: rows.filter(r => r.families === f).length
        }))
      };
    },

    experiments(q) {
      const { projectId, search, filters, sort, page, pageSize, scope } = q;
      const narrow = (list, skipStatus) => {
        let rows = list;
        if (scope) {
          if (scope.products && scope.products.length)
            rows = rows.filter(r => r.productTypes.some(t => scope.products.includes(t)));
          if (scope.network && scope.network.length)
            rows = rows.filter(r => r.networkTypes.some(t => scope.network.includes(t)));
        }
        if (!skipStatus && filters.status.length) rows = rows.filter(r => filters.status.includes(r.status));
        if (filters.region.length)   rows = rows.filter(r => filters.region.includes(r.region));
        if (filters.families.length) rows = rows.filter(r => filters.families.includes(String(r.families)));
        if (filters.from)            rows = rows.filter(r => toTime(r.startDate) >= toTime(filters.from));
        if (filters.to)              rows = rows.filter(r => toTime(r.endDate)   <= toTime(filters.to));
        if (search && search.trim()) {
          const t = search.trim().toLowerCase();
          rows = rows.filter(r =>
            String(r.id).includes(t) ||
            r.name.toLowerCase().includes(t) ||
            r.region.toLowerCase().includes(t) ||
            TwinXData.statuses[r.status].label.toLowerCase().includes(t));
        }
        return rows;
      };

      const base = TwinXData.experiments.filter(e => e.projectId === projectId);
      let rows = narrow(base, false);

      const forCounts = narrow(base, true);
      const statusCounts = {};
      TwinXData.statusOrder.forEach(id => { statusCounts[id] = forCounts.filter(r => r.status === id).length; });

      if (sort && sort.key) {
        const dir = sort.dir === 'desc' ? -1 : 1;
        const val = r => {
          switch (sort.key) {
            case 'id': return r.id;
            case 'name': return r.name.toLowerCase();
            case 'region': return r.region.toLowerCase();
            case 'startDate': return toTime(r.startDate);
            case 'endDate': return toTime(r.endDate);
            case 'families': return r.families;
            case 'status': return TwinXData.statuses[r.status].order;
            case 'iteration': return r.iteration;
            default: return r.seq;
          }
        };
        rows = [...rows].sort((a, b) => {
          const x = val(a), y = val(b);
          return x < y ? -1 * dir : x > y ? 1 * dir : a.seq - b.seq;
        });
      }

      const total = rows.length;
      const pages = Math.max(1, Math.ceil(total / pageSize));
      const safePage = Math.min(Math.max(1, page), pages);
      const start = (safePage - 1) * pageSize;
      return {
        rows: rows.slice(start, start + pageSize),
        total, page: safePage, pages, pageSize,
        rangeFrom: total ? start + 1 : 0,
        rangeTo: Math.min(start + pageSize, total),
        statusCounts
      };
    },

    createProject(name) {
      const now = new Date();
      const p = {
        id: 'p-' + Date.now(),
        name,
        modified: now.toLocaleDateString('en-GB', { weekday: 'short' }) + ', ' +
                  now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ', ' +
                  now.getFullYear() + ' ' +
                  now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
        locked: false
      };
      TwinXData.projects.unshift(p);
      return p;
    },

    createExperiment(draft) {
      const nextId = Math.max(...TwinXData.experiments.map(e => e.id)) + 1;
      const row = {
        id: nextId, seq: -1, projectId: draft.projectId,
        name: draft.name, region: draft.region,
        startDate: draft.startDate, endDate: draft.endDate,
        families: Number(draft.families),
        status: 'draft', iteration: 1, iterationsTotal: 1,
        productTypes: draft.productTypes, networkTypes: draft.networkTypes,
        simulationType: draft.simulationType || 'what-if',
        promotionType: draft.promotionType || 'pt-1',
        markets: draft.markets || [], allMarkets: !!draft.allMarkets,
        brand: draft.brand || null, applicability: draft.applicability || 'xP'
      };
      TwinXData.experiments.unshift(row);
      return row;
    },

    updateExperiment(id, patch) {
      const row = TwinXData.experiments.find(e => e.id === id);
      if (!row) return null;
      Object.assign(row, patch);
      return row;
    },

    experimentsByIds(ids) {
      return ids.map(id => TwinXData.experiments.find(e => e.id === id)).filter(Boolean);
    },

    scopeSummary(projectId, scopeSel) {
      const rows = TwinXData.experiments.filter(e => e.projectId === projectId);
      const out = { total: rows.length, scopes: {} };
      TwinXData.scopes.forEach(sc => {
        const field = sc.id === 'products' ? 'productTypes' : 'networkTypes';
        const sel = (scopeSel && scopeSel[sc.id]) || [];
        const types = {};
        sc.types.forEach(t => { types[t.id] = rows.filter(r => r[field].includes(t.id)).length; });
        out.scopes[sc.id] = {
          types,
          inScope: rows.filter(r => !sel.length || r[field].some(t => sel.includes(t))).length
        };
      });
      return out;
    }
  };

  const transport = mockTransport;            // <- swap for httpTransport at integration

  return {
    getSession:        ()  => settle(transport.session()),
    getNavigation:     ()  => settle(transport.nav()),
    getScopes:         ()  => settle(transport.scopes()),
    getStatusRegistry: ()  => settle(transport.statuses()),
    getNotifications:  ()  => settle(transport.notifications()),
    getSimulationTypes:()  => settle(transport.simulationTypes()),
    getPromotionTypes: ()  => settle(transport.promotionTypes()),
    getMarkets:        ()  => settle(transport.markets()),
    getBrands:         ()  => settle(transport.brands()),
    getPromoApplicability: () => settle(transport.promoApplicability()),
    reserveExperimentId:   () => settle(transport.nextExperimentId()),
    listFamilies:      (q) => settle(transport.families(q)),
    getFamilies:       (i) => settle(transport.familiesByIds(i)),
    listArticles:      (q) => settle(transport.articles(q)),
    getPeriods:        ()  => settle(transport.periods()),
    simulate:          (p) => settle(transport.simulate(p)),
    compare:           (p) => settle(transport.compare(p)),
    volumeSplit:       (p) => settle(transport.volumeSplit(p)),
    reportHub:         (p) => settle(transport.reportHub(p)),
    elasticity:        (p) => settle(transport.elasticity(p)),
    uploadFamilyFile:  (n, x) => settle(transport.matchFamilyUpload(n, x)),
    getProjects:       ()  => settle(transport.projects()),
    getFilterOptions:  (p) => settle(transport.filterOptions(p)),
    listExperiments:   (q) => settle(transport.experiments(q)),
    createProject:     (n) => settle(transport.createProject(n)),
    createExperiment:  (d) => settle(transport.createExperiment(d)),
    updateExperiment:  (i, p) => settle(transport.updateExperiment(i, p)),
    getExperiments:    (i) => settle(transport.experimentsByIds(i)),
    getScopeSummary:   (p, s) => settle(transport.scopeSummary(p, s)),
    exportExperiments: (q) => settle({ queued: true, format: 'xlsx', scope: q }),
    endBoot:           ()  => { booting = false; }
  };
})();
</script>

function StageTiles(counts) {
  const order = state.statusReg.order;

  return order.map((id, i) => {

    const on = state.filters.status.includes(id);
    return `

}

function pageWindow(page, pages) {
  const win = [];
  if (pages <= 7) { for (let i = 1; i <= pages; i++) win.push(i); }
  else {
    win.push(1);
    let a = Math.max(2, page - 1), b = Math.min(pages - 1, page + 1);
    if (page <= 3) { a = 2; b = 5; }
    if (page >= pages - 2) { a = pages - 4; b = pages - 1; }
    if (a > 2) win.push('…');
    for (let i = a; i <= b; i++) win.push(i);
    if (b < pages - 1) win.push('…');
    win.push(pages);
  }
  return win;
}

function Pagination(res) {
  const { page, pages } = res;
  const win = pageWindow(page, pages);
  return `<div class="table-foot">
    <span class="entries">Showing <b>${res.rangeFrom}</b> to <b>${res.rangeTo}</b> of <b>${res.total}</b> entries</span>

}

/* =========================  MOTION  ====================================== */
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let io = null;
const pendingVis = new Map();

function whenVisible(node, fn, threshold = 0) {
  if (reduced || !('IntersectionObserver' in window)) { fn(node); return; }
  if (!io) {
    io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        const job = pendingVis.get(e.target);
        if (!job) return;
        if (e.isIntersecting && e.intersectionRatio >= job.threshold) {
          pendingVis.delete(e.target); io.unobserve(e.target); job.fn(e.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: [0, .25, .6, 1] });
  }
  pendingVis.set(node, { fn, threshold });
  io.observe(node);
}
/* A sweep fires anything already inside the viewport, so a throttled
   observer can never strand visible content (spec: load +400ms, on
   visibilitychange and at 2.4s — plus one immediately, so the first
   frame is never blank). */
function sweep() {
  pendingVis.forEach((job, node) => {
    const r = node.getBoundingClientRect();
    if (r.top < innerHeight && r.bottom > 0) {
      pendingVis.delete(node); if (io) io.unobserve(node); job.fn(node);
    }
  });
}
function wireMotion(root = document) {
  root.querySelectorAll('[data-reveal]:not(.shown)').forEach(n => whenVisible(n, e => e.classList.add('shown')));
  root.querySelectorAll('tr[data-row]:not(.shown)').forEach(n => whenVisible(n, e => e.classList.add('shown')));
  root.querySelectorAll('[data-count]:not([data-counted])').forEach(n => whenVisible(n, countUp, .6));
  requestAnimationFrame(() => { sweep(); requestAnimationFrame(sweep); });
  setTimeout(sweep, 60);
}
function countUp(node) {
  node.setAttribute('data-counted', '1');
  const target = Number(node.getAttribute('data-count')) || 0;
  if (reduced) { node.textContent = target; return; }
  const t0 = performance.now(), dur = 900;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    node.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
if (window.matchMedia('(pointer:fine)').matches) {
  document.addEventListener('pointermove', e => {
    const card = e.target.closest && e.target.closest('.card');
    if (!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    card.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true });
}

/* =========================  OVERLAYS  ==================================== */
const layers = el('layers');
let pop = null;          // non-modal popover
const dstack = [];       // modal dialog stack
let scrimNode = null;

function closePop(restore = true) {
  if (!pop) return;
  const { node, anchor } = pop; pop = null;
  node.remove();
  if (anchor && anchor.isConnected) { anchor.setAttribute('aria-expanded', 'false'); if (restore) anchor.focus({ preventScroll: true }); }
}
function openPop(anchor, html, opts = {}) {
  closePop(false);
  const n = document.createElement('div');
  n.className = 'pop';
  n.setAttribute('role', 'dialog');
  if (opts.label) n.setAttribute('aria-label', opts.label);
  n.innerHTML = html;
  if (dstack.length) n.style.zIndex = '110';
  layers.appendChild(n);
  pop = { node: n, anchor };
  anchor.setAttribute('aria-expanded', 'true');
  place(n, anchor, opts.align || 'start');
  const f = n.querySelector('input,select,button,[tabindex]');
  if (f) setTimeout(() => f.focus({ preventScroll: true }), 10);
  return n;
}
function place(n, anchor, align) {
  const r = anchor.getBoundingClientRect(), w = n.offsetWidth, h = n.offsetHeight;
  let left = align === 'end' ? r.right - w : r.left;
  left = Math.min(Math.max(8, left), innerWidth - w - 8);
  let top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  n.style.left = left + 'px'; n.style.top = top + 'px';
}

function lockScroll(on) {
  if (on) {
    const sb = innerWidth - document.documentElement.clientWidth;
    document.body.style.overflow = 'hidden';
    if (sb > 0) document.body.style.paddingRight = sb + 'px';
  } else {
    document.body.style.overflow = ''; document.body.style.paddingRight = '';
  }
}
function openDialog(html, opts = {}) {
  closePop(false);
  if (!dstack.length) {
    lockScroll(true);
    scrimNode = document.createElement('div');
    scrimNode.className = 'scrim';
    scrimNode.addEventListener('click', closeAllDialogs);
    layers.appendChild(scrimNode);
  } else {
    dstack[dstack.length - 1].wrap.classList.add('recede');
  }
  const wrap = document.createElement('div');
  wrap.className = 'dlgwrap';
  wrap.innerHTML = `<div class="dlg${opts.narrow ? ' narrow' : ''}${opts.wide ? ' wide' : ''}" role="dialog" aria-modal="true"
    aria-label="${esc(opts.label || 'Dialog')}">${html}</div>`;
  layers.appendChild(wrap);
  const dlg = wrap.firstElementChild;
  const entry = { wrap, dlg, restore: document.activeElement };
  dstack.push(entry);
  wrap.addEventListener('click', e => { if (e.target === wrap) closeTopDialog(); });
  dlg.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const f = [...dlg.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
      .filter(n => n.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  wireMotion(dlg);
  const primary = dlg.querySelector('.btn-primary:not([disabled])') || dlg.querySelector('button');
  if (primary) setTimeout(() => primary.focus({ preventScroll: true }), 30);
  return dlg;
}
function closeTopDialog() {
  const e = dstack.pop();
  if (!e) return;
  e.wrap.remove();
  if (dstack.length) dstack[dstack.length - 1].wrap.classList.remove('recede');
  else { if (scrimNode) { scrimNode.remove(); scrimNode = null; } lockScroll(false); }
  const r = e.restore;
  if (r && r.isConnected) r.focus({ preventScroll: true });
  else if (!dstack.length) el('main').focus({ preventScroll: true });
}
function closeAllDialogs() { while (dstack.length) closeTopDialog(); }

function toast(text, kind = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="tk">${icon(kind === 'ok' ? 'check' : 'info', 17)}</span><span>${text}</span>`;
  el('toasts').appendChild(t);
  const kill = () => { t.classList.add('out'); setTimeout(() => t.remove(), 260); };
  setTimeout(kill, 4200);
}

/* --- the flow router: one entry per promotion type -------------------- */
function routeToFlow(type, draft) {
  if (type.status !== 'available') {
    toast(`The flow for <b>${esc(type.short)}</b> is not built yet.`, 'info');
    return;
  }
  switch (type.flow) {
    case 'discount-msrp-article': return goConfig(type, draft);
    default:
      toast(`No flow is wired for <b>${esc(type.short)}</b> yet.`, 'info');
  }
}

/* Threshold validation. The severity bands are placeholders until the client's
   own rules arrive: each article carries a minimum, a recommended and a maximum
   quantity, and the entered value is graded against them. */
const THRESHOLD_STATES = {
  critical: { icon: 'alertCircle', tone: 'bad',   hint: 'Below the minimum promotable quantity for this article.' },
  warning:  { icon: 'warnTri',     tone: 'warn',  hint: 'Below the recommended quantity. The promotion may under-deliver.' },
  review:   { icon: 'docFlag',     tone: 'twinx', hint: 'Above the maximum for this article. Needs a documented approval.' }
};

function gradeThreshold(price, entered) {
  const n = Number(entered);
  if (!Number.isFinite(n)) return null;
  if (n < price.thresholdMin) return 'critical';
  if (n < price.thresholdRecommended) return 'warning';
  if (n > price.thresholdMax) return 'review';
  return null;
}

/* Margin after the discount, with cost held fixed. */
function afterPromo(price, discount) {
  const d = Math.max(0, Math.min(99, Number(discount) || 0)) / 100;
  const m = price.marginPct / 100;
  const promoPrice = Math.round(price.sellingPrice * (1 - d) * 100) / 100;
  const margin = Math.round((1 - (1 - m) / (1 - d)) * 10000) / 100;
  return { promoPrice, margin };
}

              <td class="rsn">${a.exclusionReason ? esc(a.exclusionReason) : dash}</td>
              <td class="mono">${a.startDate ? esc(a.startDate) : dash}</td>
              <td class="mono">${a.endDate ? esc(a.endDate) : dash}</td>
              <td>${on ? 'Excluded' : 'Included'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
      ${ArticlePager(res, 'article')}`
    : `<div class="empty"><span class="ei">${icon('search', 22)}</span>
         <h3>No articles match</h3><p>Clear the filter to see every article in this family.</p></div>`;

  const volume = rows.length
    ? VolumeTable(rows, drill) + ArticlePager(res, 'article')
    : `<div class="empty"><span class="ei">${icon('search', 22)}</span>
         <h3>No articles match</h3><p>Clear the filter to see every article in this family.</p></div>`;

  const price = rows.length
    ? PriceTable(rows, drill) + ArticlePager(res, 'article')
    : `<div class="empty"><span class="ei">${icon('search', 22)}</span>
         <h3>No articles match</h3><p>Clear the filter to see every article in this family.</p></div>`;

  const body = tab === 'exclusions' ? exclusions : tab === 'volume' ? volume : price;

  const searchBox = `<span class="sbox">${icon('search', 15)}<input type="search" id="artSearch"
      placeholder="Filter articles …" autocomplete="off" value="${esc(drill.search)}"></span>`;

  const controls = (tab === 'volume' || tab === 'price') ? `
      <div class="drill-controls">
        <select id="volRegion" aria-label="Select Region"${drill.allMarkets ? ' disabled title="All markets are using the same configuration"' : ''}>
          <option value="">Select Region</option>
          ${state.markets.map(m => `<option value="${m.id}"${drill.region === m.id ? ' selected' : ''}>${esc(m.label)}</option>`).join('')}
        </select>
        ${searchBox}
        <select id="volPeriod" aria-label="Period">
          ${state.periods.map(p => `<option value="${p.id}"${drill.period === p.id ? ' selected' : ''}>${esc(p.label)}</option>`).join('')}
        </select>
      </div>` : '';

  return `
    <section class="card drill" aria-label="Articles in ${esc(family.id)}">
      <div class="drill-head">
        <h2><span class="mono">${esc(family.id)}</span> <span class="dash">-</span> ${esc(family.name)}</h2>
        ${tab !== 'exclusions'
          ? `<label class="checkline"><input type="checkbox" id="volAllMarkets" ${drill.allMarkets ? 'checked' : ''}>
               <span class="bx">${icon('check', 11)}</span> Apply Same Configuration to all markets</label>`
          : searchBox}
      </div>
      <div class="tabs-row">
        <div class="tabs" role="tablist" aria-label="Article views">
          ${DRILL_TABS.map(t => `
            <button class="tab${t.id === tab ? ' on' : ''}" role="tab" data-tab="${t.id}"
              aria-selected="${t.id === tab}">${esc(t.label)}${t.built ? '' : '<span class="flag">Not built</span>'}</button>`).join('')}
        </div>
        ${controls}
      </div>
      <div class="drill-body" role="tabpanel">${body}</div>
    </section>`;
}

async function renderDrill() {
  const c = state.config;
  if (!c || !c.drill) return;
  const host = el('drillHost');
  if (!host) return;
  const family = (c.selection.rows || []).find(f => f.id === c.drill.familyId);
  if (!family) { c.drill = null; renderConfig(); return; }
  const res = await TwinXService.listArticles({ familyId: family.id, search: c.drill.search,
    page: c.drill.page, pageSize: c.drill.tab === 'volume' ? 3 : 4,
    months: (state.periods.find(p => p.id === c.drill.period) || {}).months });
  if (res) { c.drill.page = res.page; c.drill.rows = res.rows; }
  host.innerHTML = DrillCard(family, c.drill, res);
}

function openDrill(familyId) {
  const c = state.config;
  const family = (c.selection.rows || []).find(f => f.id === familyId);
  if (!family) return;
  if (!c.exclusions) c.exclusions = {};
  if (!c.exclusions[familyId]) {
    c.exclusions[familyId] = new Set((family.articles_list || []).filter(a => a.excluded).map(a => a.id));
  }
  if (!c.volumeEdits) c.volumeEdits = {};
  if (!c.volumeEdits[familyId]) c.volumeEdits[familyId] = {};
  if (!c.priceEdits) c.priceEdits = {};
  if (!c.priceEdits[familyId]) c.priceEdits[familyId] = {};
  c.drill = {
    familyId, tab: 'exclusions', search: '', page: 1,
    excluded: c.exclusions[familyId],
    volPicked: new Set((family.articles_list || []).map(a => a.id)),
    prPicked: new Set((family.articles_list || []).map(a => a.id)),
    thrPicked: new Set(),
    expanded: new Set(), volumeEdits: c.volumeEdits[familyId],
    priceEdits: c.priceEdits[familyId],
    uniDiscount: 15, uniThreshold: 15, validated: false, copyDiscount: false,
    region: '', period: '3m', allMarkets: true, copyTargets: false
  };
  renderConfig();
  renderDrill();
  scrollTopMain();
}

/* The elasticity chart. Inline SVG so it carries the theme tokens. */
function ElasticityChart(e) {
  const W = 1120, H = 330, L = 64, R = 24, T = 26, B = 58;
  const x0 = -40, x1 = 20, y0 = -40, y1 = 40;
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const sy = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
  const path = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)} ${sy(p.v).toFixed(1)}`).join('');
  const sat = e.organic.reduce((best, p) => Math.abs(p.x - e.saturation.x) < Math.abs(best.x - e.saturation.x) ? p : best);
  const yTicks = [40, 20, 0, -20, -40], xTicks = [-40, -30, -20, -10, 0, 10, 20];

  return `
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" class="el-chart" role="img"
        aria-label="Price change against volume change for organic and promotional demand">
        <rect x="${sx(x0)}" y="${T}" width="${sx(e.flattenTo) - sx(x0)}" height="${H - T - B}" class="el-band"></rect>
        <text x="${sx(x0) + 8}" y="${T + 14}" class="el-note">Beyond ${e.flattenTo}%</text>
        ${yTicks.map(v => `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" class="el-grid"></line>
          <text x="${L - 10}" y="${sy(v) + 4}" class="el-tick" text-anchor="end">${v}%</text>`).join('')}
        ${xTicks.map(v => `<text x="${sx(v)}" y="${H - B + 22}" class="el-tick" text-anchor="middle">${v}%</text>`).join('')}
        <line x1="${sx(0)}" x2="${sx(0)}" y1="${T}" y2="${H - B}" class="el-zero"></line>
        <path d="${path(e.promo)}" class="el-line el-promo"></path>
        <path d="${path(e.organic)}" class="el-line el-organic"></path>
        <circle cx="${sx(sat.x)}" cy="${sy(sat.v)}" r="5" class="el-dot"></circle>
        <text x="${sx(sat.x) + 10}" y="${sy(sat.v) - 8}" class="el-note">${esc(e.saturation.label)}</text>
        <text x="${L - 46}" y="${(T + H - B) / 2}" class="el-axis" text-anchor="middle"
          transform="rotate(-90 ${L - 46} ${(T + H - B) / 2})">Volume Change %</text>
        <text x="${(L + W - R) / 2}" y="${H - 6}" class="el-axis" text-anchor="middle">Price change %</text>
      </svg>
      <div class="el-legend">
        <span class="lk"><i class="sw el-organic"></i>Organic</span>
        <span class="lk"><i class="sw el-promo"></i>Promo</span>
        <span class="lk"><i class="sw band"></i>Response flattens</span>
      </div>
    </div>`;
}

function ElasticityTables(e) {
  const sorted = state.reports.elSort;
  const th = (key, label, num) => `<th class="${num ? 'c-num' : ''}">
    <button class="sortbtn" data-el-sort="${key}" aria-label="Sort by ${esc(label)}">${esc(label)}
      ${icon(sorted.key === key ? (sorted.dir === 'asc' ? 'sortUp' : 'sortDown') : 'sort', 13)}</button></th>`;
  const tone = s => s === 'High' ? 'bad' : s === 'Medium' ? 'warn' : 'ok';
  return `
    <section class="card" aria-label="Elasticity across markets">
      <div class="card-head"><span class="bar"></span>
        <h2><span class="mono">${esc(e.article.code)}</span> ${esc(e.article.name)} <span class="dim">— across markets</span></h2>
        <button class="btn btn-ghost btn-sm" id="elCompare">Compare across family</button></div>
      <div class="card-body">
        <div class="fam-scroll">
          <table class="fam-table el-table">
            <thead><tr>
              ${th('market', 'Market')}${th('volume', 'Volume (Units)', true)}
              ${th('organic', 'Organic Elasticity', true)}${th('promo', 'Promo Elasticity', true)}
              ${th('delta', '\u0394 (Org - Promo)', true)}${th('saturates', 'Saturates at', true)}
              <th>Sensitivity</th>
            </tr></thead>
            <tbody>${e.markets.map(m => `<tr>
              <td class="nm">${esc(m.market)}</td>
              <td class="c-num mono">${nf(m.volume)}</td>
              <td class="c-num mono">${nf2(m.organic).replace('-', '\u2212')}</td>
              <td class="c-num mono">${nf2(m.promo).replace('-', '\u2212')}</td>
              <td class="c-num mono">${nf2(m.delta).replace('-', '\u2212')}</td>
              <td class="c-num mono">${String(m.saturates).replace('-', '\u2212')}%</td>
              <td><span class="tone-chip t-${tone(m.sensitivity)}"><span class="sw"></span>${esc(m.sensitivity)}</span></td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
        <p class="el-rule">${esc(e.rule)}</p>
      </div>
    </section>`;
}

function ReportsPage() {
  const r = state.reports;
  if (!r) return '';
  const tabs = `
    <div class="rep-tabs" role="tablist" aria-label="Report sections">
      ${REPORT_TABS.map(t => `<button class="rep-tab" role="tab" data-rep-tab="${t.id}"
        aria-selected="${t.id === r.tab}">${esc(t.label)}</button>`).join('')}
    </div>`;

  if (r.tab === 'analytics') {
    const e = r.elasticity;
    return `${tabs}${ReportFilters(false)}
      ${e ? `
      <section class="card" aria-label="Price elasticity">
        <div class="card-head"><span class="bar"></span>
          <span class="t"><h2>Price Elasticity (Price vs Volume)</h2>
            <span class="s">Comparison of Elasticity between Promotional vs Non Promotional periods.
              <span class="i" title="Fitted on the periods in view; the endpoint supplies the real fit.">${icon('info', 12)}</span></span></span>
        </div>
        <div class="card-body">${ElasticityChart(e)}</div>
      </section>
      ${ElasticityTables(e)}` : '<section class="card sel-body"><div class="empty"><h3>Loading the elasticity fit…</h3></div></section>'}`;
  }

  const d = r.data;
  return `${tabs}${ReportFilters(true)}
    ${d ? `${StageTracker(d)}${PerformanceSummary(d)}${TrackingTable(d)}`
        : '<section class="card sel-body"><div class="empty"><h3>Loading the report…</h3></div></section>'}`;
}

function renderReports() {
  el('viewReports').innerHTML = ReportsPage();
  wireMotion(el('viewReports'));
}


/* =========================  Experiment Compare  ==========================
   Reached from the experiment table: tick two or more promotions and press
   Compare. Every card lines the promotions up in the same column order. */

function CompareConfigCard(d) {
  const fields = [
    ['Promotion ID', p => `<b class="mono">${esc(String(p.id))}</b>` +
      `<span class="iter-badge">Iteration ${esc(String(p.iteration))}</span>`],
    ['Promotion Name', p => esc(p.name)],
    ['Promotion Type', p => esc(p.type)],
    ['Markets', p => esc(p.markets)],
    ['Duration', p => esc(p.duration)]
  ];
  return `
    <section class="card" data-reveal aria-label="Configuration summary">
      <div class="card-head"><span class="bar"></span><h2>Configuration Summary</h2></div>
      <div class="card-body">
        <div class="fam-scroll">
          <table class="fam-table cmp-sum">
            <tbody>${fields.map(([label, get]) => {
              const vals = d.promos.map(get);
              const differs = new Set(vals).size > 1;
              return `<tr><th scope="row">${esc(label)}</th>${
                vals.map(v => `<td${differs ? ' class="diff"' : ''}>${v}</td>`).join('')}</tr>`;
            }).join('')}</tbody>
          </table>
        </div>
      </div>
    </section>`;
}

      <td class="nm"><span class="mono">${esc(String(p.id))}</span> ${esc(p.name)}</td>
      ${s ? `<td class="c-num mono">${nf(s.discountPct)}</td>
             <td class="c-num mono">${nf(s.targetVolume)}</td>
             <td class="c-num mono">${nf2(s.totalDiscount)}</td>
             <td class="c-num mono">${nf2(s.unitMargin)}</td>`
          : `<td class="dim" colspan="4">Not part of this promotion</td>`}
    </tr>`;
  return `
    <section class="card" data-reveal aria-label="Configure product and pricing">
      <div class="card-head"><span class="bar"></span><h2>Configure Product and Pricing</h2></div>
      <div class="card-body">
        <div class="cmp-fams">
          ${d.families.map(f => `
            <div class="cmp-fam${open.has(f.id) ? ' open' : ''}">
              <button class="cf-head" data-cmp-fam="${esc(f.id)}" aria-expanded="${open.has(f.id)}">
                <span class="cf-name"><span class="mono">${esc(f.id)}</span> - ${esc(f.name)}</span>
                <span class="cf-right">
                  <span class="cf-class">Competitive Class: <b>${esc(f.competitiveness)}</b></span>
                  <span class="car">${icon('chevDown', 15)}</span>
                </span>
              </button>
              ${open.has(f.id) ? `
                <div class="cf-body">
                  <div class="fam-scroll">
                    <table class="fam-table">
                      <thead><tr>
                        <th>Promotion</th>
                        <th class="c-num">Discount / Unit (%)</th>
                        <th class="c-num">Target Volume (units)</th>
                        <th class="c-num">Total Promo Discount (&euro;)</th>
                        <th class="c-num">Unit Margin after discount (&euro;)</th>
                      </tr></thead>
                      <tbody>${d.promos.map((p, i) => row(f, p, f.stats[i])).join('')}</tbody>

                </div>` : ''}
            </div>`).join('')}

      </div>

}

  };
  const alt = i => (Math.floor(i / 2) % 2 ? ' g-alt' : '');
  return `
    <section class="card" data-reveal aria-label="Output summary">
      <div class="card-head"><span class="bar"></span><h2>Output Summary</h2></div>

          <select id="cmpFamily" aria-label="Family">
            <option value="">All Families</option>

              o.id === draft.familyId ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
          </select>

            <option value="">All Articles</option>
            ${d.articleOptions.map(o => `<option value="${esc(o.id)}"${

                    aria-label="Download the comparison">${icon('download', 16)}</button>
          </span>

        <div class="fam-scroll" style="margin-top:14px">

            <thead>
              <tr>
                <th rowspan="2" class="c-metric">Metric Comparison</th>
                ${d.promos.map((p, i) => `<th colspan="2" class="grp${i % 2 ? ' g-alt' : ''}">
                  <span class="mono">${esc(String(p.id))}</span>, ${esc(p.name)}</th>`).join('')}
              </tr>

                ${d.promos.map((p, i) => `
