<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promotool — Promotion Optimization</title>
</head>
<body>
<script>
/* Pre-paint: stamp the theme before the stylesheet so the first paint is correct. */
(function () {
  var r = document.documentElement, t = null, a = null;
  try { t = localStorage.getItem('pt.theme'); a = localStorage.getItem('pt.accent'); } catch (e) {}
  if (!t) { t = r.getAttribute('data-theme'); }
  if (!t) { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
  r.setAttribute('data-theme', t);
  r.setAttribute('data-accent', a || 'mono');
})();
</script>
<title>TwinX Experiment Control Center</title>
<style>
/* ==========================================================================
   Promotool B&W UI — token layer, ported verbatim from the design spec.
   Selector order: scale → theme → accent → derived → light ink cap.
   ========================================================================== */

/* 1. :root — scale, fonts, easing (plus the dark palette as the unstamped default) */
:root{
  --r-sm:4px; --r-md:6px; --r-lg:8px;
  --rail:56px; --rail-open:216px; --topbar:56px;
  --gut:clamp(16px, 2vw, 24px);
  --gap:20px;
  --cell-x:12px;
  --ease:cubic-bezier(.16, 1, .3, 1);
  --ease-io:cubic-bezier(.65, 0, .35, 1);
  --dur:560ms;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;

  --bg:#08090A;
  --surface:#0D0F11;
  --surface-2:#121417;
  --surface-3:#191C20;
  --line:rgba(255,255,255,.085);
  --line-2:rgba(255,255,255,.16);
  --fg:#F3F4F5;
  --fg-2:#A5AAB1;
  --fg-3:#7F858E;
  --grid:rgba(255,255,255,.028);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -18px rgba(0,0,0,.9);
  --scrim:rgba(0,0,0,.62);
  --l1:96%; --l2:46%; --l3:76%; --l4:34%; --l5:66%; --l6:26%; --l7:86%; --l8:56%; --l9:40%;
}
/* unstamped + OS light (the pre-paint script normally stamps, this is the fallback) */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F7F7F8; --surface:#FFFFFF; --surface-2:#F3F4F5; --surface-3:#E9EAEC;
    --line:rgba(8,9,10,.10); --line-2:rgba(8,9,10,.20);
    --fg:#0A0B0D; --fg-2:#54595F; --fg-3:#6B7077;
    --grid:rgba(8,9,10,.032);
    --shadow:0 1px 2px rgba(8,9,10,.04), 0 12px 28px -20px rgba(8,9,10,.35);
    --scrim:rgba(10,11,13,.42);
    --l1:13%; --l2:62%; --l3:30%; --l4:74%; --l5:42%; --l6:84%; --l7:22%; --l8:52%; --l9:66%;
  }
}

/* 2. theme — surfaces, text, lines, shadow, chart lightness steps */
:root[data-theme="dark"]{
  --bg:#08090A; --surface:#0D0F11; --surface-2:#121417; --surface-3:#191C20;
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.16);
  --fg:#F3F4F5; --fg-2:#A5AAB1; --fg-3:#7F858E;
  --grid:rgba(255,255,255,.028);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -18px rgba(0,0,0,.9);
  --scrim:rgba(0,0,0,.62);
  --l1:96%; --l2:46%; --l3:76%; --l4:34%; --l5:66%; --l6:26%; --l7:86%; --l8:56%; --l9:40%;
}
:root[data-theme="light"]{
  --bg:#F7F7F8; --surface:#FFFFFF; --surface-2:#F3F4F5; --surface-3:#E9EAEC;
  --line:rgba(8,9,10,.10); --line-2:rgba(8,9,10,.20);
  --fg:#0A0B0D; --fg-2:#54595F; --fg-3:#6B7077;
  --grid:rgba(8,9,10,.032);
  --shadow:0 1px 2px rgba(8,9,10,.04), 0 12px 28px -20px rgba(8,9,10,.35);
  --scrim:rgba(10,11,13,.42);
  --l1:13%; --l2:62%; --l3:30%; --l4:74%; --l5:42%; --l6:84%; --l7:22%; --l8:52%; --l9:66%;
}

/* 3. accent — hue, saturation, lightness, acc-fg, chart saturation */
:root[data-accent="mono"]  { --acc-h:0;   --acc-s:0%;  --acc-l:100%; --acc-fg:#08090A; --chart-s:0%;  --chart-h:0; }
:root[data-theme="light"][data-accent="mono"]{ --acc-l:10%; --acc-fg:#FFFFFF; }
:root[data-accent="ice"]   { --acc-h:206; --acc-s:76%; --acc-l:58%;  --acc-fg:#04080D; --chart-s:40%; --chart-h:206; }
:root[data-accent="amber"] { --acc-h:37;  --acc-s:92%; --acc-l:56%;  --acc-fg:#150D00; --chart-s:44%; --chart-h:37; }
:root[data-accent="lime"]  { --acc-h:96;  --acc-s:52%; --acc-l:54%;  --acc-fg:#060D03; --chart-s:34%; --chart-h:96; }
:root[data-accent="violet"]{ --acc-h:264; --acc-s:66%; --acc-l:66%;  --acc-fg:#0A0512; --chart-s:36%; --chart-h:264; }

/* 4. derived */
:root{
  --acc-l-ink:var(--acc-l);
  --accent:hsl(var(--acc-h) var(--acc-s) var(--acc-l));
  --acc-ink:hsl(var(--acc-h) var(--acc-s) var(--acc-l-ink));
  --accent-12:hsl(var(--acc-h) var(--acc-s) var(--acc-l) / .12);
  --accent-20:hsl(var(--acc-h) var(--acc-s) var(--acc-l) / .20);
  --accent-40:hsl(var(--acc-h) var(--acc-s) var(--acc-l) / .40);
  --c1:hsl(var(--chart-h) var(--chart-s) var(--l1));
  --c2:hsl(var(--chart-h) var(--chart-s) var(--l2));
  --c3:hsl(var(--chart-h) var(--chart-s) var(--l3));
  --c4:hsl(var(--chart-h) var(--chart-s) var(--l4));
  --c5:hsl(var(--chart-h) var(--chart-s) var(--l5));
  --c6:hsl(var(--chart-h) var(--chart-s) var(--l6));
  --c7:hsl(var(--chart-h) var(--chart-s) var(--l7));
  --c8:hsl(var(--chart-h) var(--chart-s) var(--l8));
  --c9:hsl(var(--chart-h) var(--chart-s) var(--l9));
}
/* 5. must out-specify step 4 */
:root[data-theme="light"]{ --acc-l-ink:min(var(--acc-l), 32%); }
/* Validation outcome is the one place hue carries meaning regardless of accent. */
:root{ --ok:hsl(151 58% 48%); --bad:hsl(3 74% 62%); --twinx:hsl(304 66% 68%); --promo:hsl(28 88% 60%); --warn:hsl(40 92% 58%); }
:root[data-theme="light"]{ --ok:hsl(151 62% 28%); --bad:hsl(3 68% 44%); --twinx:hsl(304 62% 42%); --promo:hsl(26 84% 42%); --warn:hsl(36 86% 38%); }

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%;
  background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% 0%, #000 25%, transparent 78%);
  mask-image:radial-gradient(120% 90% at 50% 0%, #000 25%, transparent 78%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;color:inherit}
h1,h2,h3{margin:0}
:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px;border-radius:var(--r-sm)}
::selection{background:var(--accent-40)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{
  position:absolute;left:-9999px;top:0;z-index:200;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r-md);padding:10px 14px;font-size:13px;
}
.skip:focus{left:var(--gut);top:8px}
.ulabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}

/* ==========================================================================
   Shell
   ========================================================================== */
.app{position:relative;z-index:1;min-height:100%}

/* --- rail --- */
.rail{
  position:fixed;left:0;top:0;bottom:0;z-index:60;
  width:var(--rail);padding:10px;padding-top:calc(10px + env(safe-area-inset-top, 0px));
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;overflow:hidden;
  transition:width 420ms var(--ease);
}
.rail:hover,.rail:focus-within,.rail.is-pinned{width:var(--rail-open)}
.rail-sep{height:1px;background:var(--line);margin:8px 2px}
.rail-spacer{flex:1;min-height:8px}
.rail-item{
  position:relative;display:flex;align-items:center;gap:12px;
  height:36px;padding:0 8px;border-radius:var(--r-md);
  color:var(--fg-3);width:100%;text-align:left;white-space:nowrap;
  transition:background 160ms var(--ease),color 160ms var(--ease);
}
.rail-item:hover{color:var(--fg);background:var(--surface-2)}
.rail-item .ico{flex:0 0 20px;display:grid;place-items:center}
.rail-item .lbl{
  font-size:13px;opacity:0;transform:translateX(-6px);
  transition:opacity 260ms var(--ease),transform 260ms var(--ease);
}
.rail:hover .rail-item .lbl,.rail:focus-within .rail-item .lbl,.rail.is-pinned .rail-item .lbl{opacity:1;transform:none}
.rail-item[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.rail-item[aria-current="page"]::before{
  content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:2px;background:var(--acc-ink);
}
.rail-item .soon{
  margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--fg-3);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;height:16px;
  display:grid;place-items:center;opacity:0;transition:opacity 260ms var(--ease);
}
.rail:hover .soon,.rail:focus-within .soon,.rail.is-pinned .soon{opacity:1}
.rail-scrim{display:none}

/* --- main --- */
.main{min-width:0;margin-left:var(--rail);display:flex;flex-direction:column;transition:margin-left 420ms var(--ease)}

/* --- top bar --- */
.topbar{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;
  height:var(--topbar);display:flex;align-items:center;gap:10px;
  padding:0 var(--gut);
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar .burger{display:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .wm{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand .wm sup{font-size:8px;font-weight:400;vertical-align:super;color:var(--fg-3)}
.brand .pw{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--fg-3);white-space:nowrap}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.swatches{display:flex;align-items:center;gap:6px}
.swatch{
  width:16px;height:16px;border-radius:999px;border:1px solid var(--line-2);
  transition:transform 160ms var(--ease),box-shadow 160ms var(--ease);
}
.swatch:hover{transform:scale(1.12)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--acc-ink)}
.bar-div{width:1px;height:22px;background:var(--line);margin:0 4px}
.iconbtn{
  position:relative;width:36px;height:36px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);color:var(--fg-2);
  transition:background 160ms var(--ease),color 160ms var(--ease),border-color 160ms var(--ease),transform 120ms var(--ease);
}
.iconbtn:hover{color:var(--fg);border-color:var(--line-2)}
.iconbtn:active{transform:scale(.94)}
.iconbtn[aria-expanded="true"]{background:var(--surface-3);color:var(--fg);border-color:var(--line-2)}
.iconbtn.sm{width:26px;height:26px;border-radius:var(--r-sm)}
.iconbtn.spin svg{animation:spin360 520ms var(--ease-io)}
@keyframes spin360{to{transform:rotate(360deg)}}
.bellwrap{position:relative}
.bell-count{
  position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--accent);color:var(--acc-fg);
  font-family:var(--mono);font-size:9.5px;font-weight:600;display:grid;place-items:center;
}
.bell-count::after{
  content:"";position:absolute;inset:0;border-radius:999px;border:1px solid var(--accent);
  animation:pulse-ring 2.6s var(--ease-io) infinite;
}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(2.6);opacity:0}}
.langbtn,.userbtn{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;border-radius:var(--r-md);
  color:var(--fg-2);font-size:13px;transition:background 160ms var(--ease),color 160ms var(--ease);
}
.langbtn:hover,.userbtn:hover{background:var(--surface-2);color:var(--fg)}
.avatar{
  width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-md);display:grid;place-items:center;
  background:var(--surface-3);border:1px solid var(--line-2);
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg);
}
.who{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.who b{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--fg);white-space:nowrap}
.who span{font-size:11px;color:var(--fg-3);white-space:nowrap}

/* --- page head --- */
.pagehead{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:22px var(--gut) 20px;
}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-3);margin-bottom:8px;flex-wrap:wrap}
.crumb b{font-weight:500;color:var(--fg-3)}
.crumb .cur{color:var(--fg-2)}
h1{font-size:clamp(22px, 2.4vw, 30px);font-weight:600;letter-spacing:-.022em;line-height:1.15}
h1 .dim{color:var(--fg-3);font-weight:400}
.subtitle{font-size:13.5px;color:var(--fg-2);margin-top:6px}

/* --- content column --- */
.content{padding:var(--gap) var(--gut) 56px;display:flex;flex-direction:column;gap:var(--gap)}

/* ==========================================================================
   Components
   ========================================================================== */
.card{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;
  transition:border-color 220ms var(--ease);
}
.card:hover{border-color:var(--line-2)}
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(460px circle at var(--mx,50%) var(--my,0%), var(--accent-12), transparent 62%);
  transition:opacity 260ms var(--ease);
}
@media (pointer:fine){ .card:hover::after{opacity:.6} }

.card-head{
  display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
}
.card-head .bar{width:3px;height:16px;background:var(--acc-ink);border-radius:2px;flex:0 0 3px}
.card-head h2{font-size:14px;font-weight:600;letter-spacing:-.008em}
.card-head .tag{margin-left:auto}

.section-head{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px dashed var(--line);flex-wrap:wrap;
}
.section-head .bar{width:3px;height:34px;background:var(--acc-ink);border-radius:2px;flex:0 0 3px}
.section-head .titles{display:flex;flex-direction:column;gap:1px;min-width:0}
.section-head h2{font-size:15px;font-weight:600;letter-spacing:-.012em}
.section-head .sub{font-size:12.5px;color:var(--fg-2)}
.section-head .actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-body{padding:16px 18px}

/* --- buttons --- */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:36px;padding:0 20px;border-radius:var(--r-md);
  font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent;overflow:hidden;
  transition:filter 180ms var(--ease),box-shadow 180ms var(--ease),background 180ms var(--ease),border-color 180ms var(--ease),transform 120ms var(--ease),opacity 180ms var(--ease);
}
.btn-primary{background:var(--accent);color:var(--acc-fg);border-color:var(--accent)}
.btn-primary:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 0 0 1px var(--accent-40),0 6px 22px -10px var(--accent)}
.btn-primary::after{
  content:"";position:absolute;top:0;bottom:0;width:38%;left:-45%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);
  transform:skewX(-14deg);pointer-events:none;
}
.btn-primary:hover:not(:disabled)::after{animation:sheen 900ms var(--ease-io)}
@keyframes sheen{to{left:120%}}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--fg)}
.btn-ghost:hover:not(:disabled){border-color:var(--fg-3);background:var(--surface-3)}
.btn:active:not(:disabled){transform:scale(.975)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn .n{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 5px;border-radius:3px;background:rgba(128,128,128,.28)}
.btn-link{
  height:36px;padding:0 6px;font-size:13px;color:var(--fg-2);border-bottom:1px solid transparent;
  display:inline-flex;align-items:center;
}
.btn-link:hover{color:var(--fg);border-bottom-color:var(--line-2)}

/* --- inputs --- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.ulabel{color:var(--fg-3)}
.control{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;width:100%;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
  color:var(--fg);font-size:13px;text-align:left;
  transition:border-color 160ms var(--ease),background 160ms var(--ease),box-shadow 160ms var(--ease);
}
.control:hover:not(:disabled){background:var(--surface-3)}
.control[aria-expanded="true"],.control:focus-visible{border-color:var(--acc-ink);box-shadow:0 0 0 3px var(--accent-20);outline:none}
.control.is-set{border-color:var(--line-2)}
.control.is-error{border-color:var(--acc-ink)}
.control .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.control .v.ph{color:var(--fg-3)}
.control .car{flex:0 0 auto;color:var(--fg-3)}
input[type="text"],input[type="date"],input[type="search"],select,textarea{
  height:36px;padding:0 12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);color:var(--fg);font-size:13px;width:100%;
  transition:border-color 160ms var(--ease),box-shadow 160ms var(--ease);
}
textarea{height:auto;min-height:132px;padding:10px 12px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc-ink);box-shadow:0 0 0 3px var(--accent-20)}
input[aria-invalid="true"]{border-color:var(--acc-ink)}
input::placeholder{color:var(--fg-3)}
input[type="date"]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.err{font-size:11.5px;color:var(--acc-ink)}
.hint{font-size:11.5px;color:var(--fg-3)}

.search{position:relative;width:260px;max-width:100%}
.search input{padding-left:34px}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--fg-3);pointer-events:none}
.search .sx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--fg-3)}
.search .sx:hover{background:var(--surface-3);color:var(--fg)}

/* --- badges, chips --- */
.badge{
  display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:2px 9px 2px 8px;
  border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);
  font-size:11.5px;font-weight:500;line-height:1.25;color:var(--fg-2);max-width:100%;
}
.badge .dot{flex:0 0 auto}
.badge[data-marker="solid"]{color:var(--fg)}
.badge[data-marker="check"]{color:var(--fg-2)}
.badge[data-marker="ring-mute"]{color:var(--fg-3);border-color:var(--line)}
.badge[data-marker="attention"]{
  color:var(--acc-ink);border-color:var(--accent-40);background:var(--accent-12);font-weight:600;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 7px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--line-2);border-radius:3px;color:var(--fg-2);background:transparent;
  transition:background 160ms var(--ease),color 160ms var(--ease),border-color 160ms var(--ease);
}
.chip .sw{width:8px;height:8px;flex:0 0 8px;border-radius:2px;background:var(--fg-3)}
.chip:hover{border-color:var(--fg-3);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--surface-3);color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed="false"]{opacity:.5}
.chip .n{font-size:9.5px;color:var(--fg-3);letter-spacing:.04em}
.iter{
  display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line-2);border-radius:3px;color:var(--fg-2);
}
.iter b{color:var(--fg);font-weight:600}
.iter i{font-style:normal;color:var(--fg-3)}

/* --- scope cards --- */
.scope-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.scope-body{display:flex;flex-direction:column;gap:10px;padding:14px 18px}
.scope-top{display:flex;align-items:flex-start;gap:14px}
.scope-ico{
  width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;
  border:1px solid var(--line-2);border-radius:var(--r-md);color:var(--fg-2);background:var(--surface-2);
}
.scope-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.scope-meta .k{font-size:12px;color:var(--fg-3)}
.scope-meta .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.scope-meta .of{font-family:var(--mono);font-size:11.5px;color:var(--fg-3)}
.scope-types{display:flex;flex-wrap:wrap;gap:6px}
.scope-bar{display:flex;height:4px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.scope-bar i{display:block;height:100%;transition:opacity 220ms var(--ease)}
.scope-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--fg-3);padding-top:2px;border-top:1px dashed var(--line);margin-top:2px}

/* --- filter row --- */
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:16px 18px}
.filters .field{flex:1 1 180px}
.filter-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}

/* --- stage tiles (KPI recipe) --- */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap)}
.stage{
  position:relative;display:flex;flex-direction:column;gap:7px;padding:12px 13px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  transition:transform 220ms var(--ease),border-color 220ms var(--ease);
}
.stage:hover{transform:translateY(-2px);border-color:var(--line-2)}
.stage:hover .stage-ico,.stage:hover .stage-meter i{color:var(--acc-ink)}
.stage:hover .stage-meter i{background:var(--acc-ink)}
.stage[aria-pressed="true"]{border-color:var(--acc-ink);background:var(--accent-12)}
.stage-row{display:flex;align-items:center;gap:10px}
.stage-ico{
  width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;
  border:1px solid var(--line-2);border-radius:var(--r-md);color:var(--fg-2);
  transition:color 220ms var(--ease);
}
.stage-n{margin-left:auto;font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--fg)}
.stage-lbl{font-size:12px;color:var(--fg-2);line-height:1.25;min-height:30px}
.stage-foot{display:flex;align-items:center;gap:8px;margin-top:-2px}
.stage-step{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--fg-3)}
.stage-meter{width:56px;height:3px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-left:auto;opacity:.5}
.stage-meter i{display:block;height:100%;background:var(--fg-2);transition:background 220ms var(--ease)}

/* --- workspace split --- */
.work-grid{display:grid;grid-template-columns:minmax(0,228px) minmax(0,1fr);gap:var(--gap);align-items:start}

/* --- project list --- */
.projects{display:flex;flex-direction:column;gap:8px;padding:14px}
.project{
  position:relative;display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;
  padding:11px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
  transition:border-color 160ms var(--ease),background 160ms var(--ease);
}
.project:hover{border-color:var(--line-2);background:var(--surface-3)}
.project[aria-pressed="true"]{background:var(--accent-12);border-color:var(--acc-ink)}
.project[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--acc-ink)}
.project .pn{display:flex;align-items:center;gap:8px}
.project .pn b{font-size:13px;font-weight:600;color:var(--fg)}
.project .lock{margin-left:auto;color:var(--fg-3);flex:0 0 auto}
.project .pw2{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.project .pc{font-size:11.5px;color:var(--fg-3);display:flex;align-items:center;gap:6px;margin-top:2px}
.project .pc b{font-family:var(--mono);color:var(--fg-2);font-weight:600}
.panel-note{
  display:flex;gap:8px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line);
  background:var(--surface-2);font-size:11.5px;color:var(--fg-3);
}

/* --- data table (scoped, per the spec's gotcha) --- */
.table-scroll{overflow-x:auto;border-top:1px solid var(--line)}
table.data-table{width:100%;border-collapse:separate;border-spacing:0}
.data-table thead th{
  background:var(--surface-2);border-bottom:1px solid var(--line);
  padding:9px var(--cell-x);text-align:left;white-space:nowrap;
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);
}
.data-table thead th button{
  display:inline-flex;align-items:center;gap:5px;color:inherit;font:inherit;letter-spacing:inherit;
  text-transform:inherit;transition:color 160ms var(--ease);
}
.data-table thead th button:hover{color:var(--fg)}
.data-table thead th[aria-sort="ascending"] button,
.data-table thead th[aria-sort="descending"] button{color:var(--fg)}
.data-table thead th .sico{opacity:.45;transition:opacity 160ms var(--ease)}
.data-table thead th[aria-sort="ascending"] .sico,
.data-table thead th[aria-sort="descending"] .sico{opacity:1;color:var(--acc-ink)}
.data-table tbody td{
  padding:13px var(--cell-x);border-bottom:1px solid var(--line);
  font-size:13px;color:var(--fg-2);vertical-align:middle;white-space:nowrap;
  transition:color 160ms var(--ease);
}
.data-table tbody tr{position:relative;transition:background 160ms var(--ease)}
.data-table tbody tr:hover{background:var(--surface-2)}
.data-table tbody tr:hover td{color:var(--fg)}
.data-table tbody tr td:first-child::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc-ink);
  transform:scaleY(0);transform-origin:center;transition:transform 220ms var(--ease);
}
.data-table tbody tr:hover td:first-child::before,
.data-table tbody tr.is-picked td:first-child::before{transform:scaleY(1)}
.data-table tbody tr.is-picked{background:var(--accent-12)}
.data-table tbody tr:last-child td{border-bottom:0}
.c-check{width:44px;padding-right:0 !important}
.c-act{width:1%;text-align:right}
.data-table thead th.c-act{text-align:right}
.c-id button{
  font-family:var(--mono);font-size:12.5px;color:var(--fg-2);border-bottom:1px solid var(--line-2);
  transition:color 160ms var(--ease),border-color 160ms var(--ease);
}
.c-id button:hover{color:var(--acc-ink);border-color:var(--acc-ink)}
.c-name{color:var(--fg);font-weight:600;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.c-mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}

/* checkbox */
.cbx{position:relative;display:inline-grid;place-items:center;width:18px;height:18px}
.cbx input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.cbx .bx{
  width:16px;height:16px;border-radius:var(--r-sm);border:1px solid var(--line-2);
  background:var(--surface-2);display:grid;place-items:center;color:transparent;pointer-events:none;
  transition:background 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease);
}
.cbx input:hover+.bx{border-color:var(--fg-3)}
.cbx input:checked+.bx,.cbx input:indeterminate+.bx{background:var(--accent);border-color:var(--accent);color:var(--acc-fg)}
.cbx .bx.on{background:var(--accent);border-color:var(--accent);color:var(--acc-fg)}
.cbx input:focus-visible+.bx{outline:2px solid var(--acc-ink);outline-offset:2px}

/* row actions */
.racts{display:inline-flex;align-items:center;gap:2px;justify-content:flex-end}
.ract{
  width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--fg-3);border:1px solid transparent;background:transparent;
  transition:background 160ms var(--ease),color 160ms var(--ease),border-color 160ms var(--ease);
}
.ract:hover{color:var(--acc-ink);background:var(--surface-3);border-color:var(--line-2)}
.ract.res{color:var(--acc-ink);border-color:var(--line-2);background:var(--accent-12)}
.ract.res:hover{background:var(--accent-20)}

/* simulation progress on the experiment row */
.simbar{display:inline-flex;align-items:center;gap:9px;min-width:132px}
.simbar .sb-track{
  flex:1 1 auto;height:5px;border-radius:999px;background:var(--surface-3);
  border:1px solid var(--line);overflow:hidden;
}
.simbar .sb-track i{
  display:block;height:100%;background:var(--accent);
  transition:width 140ms linear;
}
.simbar .sb-n{flex:0 0 auto;font-size:11px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.simlink{
  display:block;margin-top:5px;font-size:11.5px;color:var(--acc-ink);
  text-decoration:underline;text-underline-offset:2px;text-align:left;
}
.simlink:hover{color:var(--fg)}
.data-table tbody tr.is-fresh{background:var(--accent-12)}
.data-table tbody tr.is-fresh td:first-child::before{transform:scaleY(1)}

/* table footer + pagination */
.table-foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;
  padding:11px 18px;border-top:1px solid var(--line);background:var(--surface-2);
}
.entries{font-size:11.5px;color:var(--fg-3);margin-right:auto}
.entries b{font-family:var(--mono);color:var(--fg-2);font-weight:600}
.pager{display:flex;align-items:center;gap:4px}
.pg{
  min-width:28px;height:28px;padding:0 7px;display:grid;place-items:center;border-radius:var(--r-sm);
  font-family:var(--mono);font-size:12px;color:var(--fg-2);border:1px solid transparent;
  transition:background 160ms var(--ease),color 160ms var(--ease),border-color 160ms var(--ease);
}
.pg:hover:not(:disabled){background:var(--surface-3);color:var(--fg)}
.pg[aria-current="page"]{border-color:var(--acc-ink);background:var(--accent-12);color:var(--fg)}
.pg:disabled{opacity:.35;cursor:not-allowed}
.pg-gap{color:var(--fg-3);font-family:var(--mono);padding:0 2px}
.rows-sel{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-3)}
.rows-sel select{width:auto;height:28px;padding:0 6px;font-size:12px}

/* empty + skeleton */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 18px;text-align:center}
.empty .ei{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:var(--r-md);color:var(--fg-3)}
.empty h3{font-size:15px;font-weight:600;color:var(--fg)}
.empty p{margin:0;font-size:13px;color:var(--fg-3);max-width:46ch}
.sk{display:block;height:10px;border-radius:3px;background:var(--surface-3);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,var(--line-2),transparent);animation:shim 1.2s infinite}
@keyframes shim{to{transform:translateX(100%)}}

/* ==========================================================================
   Popovers
   ========================================================================== */
.pop{
  position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-md);box-shadow:0 40px 90px -30px rgba(0,0,0,.75);padding:6px;
  min-width:220px;max-width:min(92vw,340px);
  animation:popin 220ms var(--ease);
}
@keyframes popin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop-head{padding:8px 10px 4px;display:flex;align-items:center;gap:8px}
.pop-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.opt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:var(--r-sm);font-size:13px;color:var(--fg-2);
  transition:background 140ms var(--ease),color 140ms var(--ease);
}
.opt:hover{background:var(--surface-2);color:var(--fg)}
.opt[aria-selected="true"]{color:var(--fg)}
.opt .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .n{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.opt .tk{color:var(--acc-ink);opacity:0}
.opt[aria-selected="true"] .tk{opacity:1}
.pop-foot{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line);margin-top:6px}
.pop-foot .btn{flex:1;height:32px;padding:0 10px}
.pop-sep{height:1px;background:var(--line);margin:6px 0}
.pop-who{padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.pop-who b{font-size:13px;font-weight:600;color:var(--fg)}
.pop-who span{font-size:11.5px;color:var(--fg-3)}
.daterange{display:flex;flex-direction:column;gap:12px;padding:8px}
.dr-row{display:flex;gap:10px}
.dr-row .field{flex:1}
.dr-presets{display:flex;flex-wrap:wrap;gap:6px}
.notif{display:flex;gap:10px;width:100%;text-align:left;padding:10px;border-radius:var(--r-sm);transition:background 140ms var(--ease)}
.notif:hover{background:var(--surface-2)}
.notif .nb{min-width:0;display:flex;flex-direction:column;gap:2px}
.notif .nt{font-size:12.5px;color:var(--fg-2);line-height:1.4}
.notif .nt b{color:var(--fg);font-weight:600}
.notif .nw{font-family:var(--mono);font-size:10.5px;color:var(--fg-3)}

/* ==========================================================================
   Dialog stack
   ========================================================================== */
.scrim{
  position:fixed;inset:0;z-index:90;background:var(--scrim);backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);animation:fadein 300ms var(--ease);
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dlgwrap{
  position:fixed;inset:0;z-index:95;display:grid;place-items:center;
  padding:clamp(12px, 3vh, 40px);pointer-events:none;
}
.dlg{
  position:relative;pointer-events:auto;width:100%;max-width:880px;max-height:100%;
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.75);overflow:hidden;
  animation:dlgin 420ms var(--ease);
}
.dlg.narrow{max-width:720px}
@keyframes dlgin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.dlg::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--acc-ink),transparent);
}
.dlgwrap.recede .dlg{transform:translateY(-8px) scale(.965);filter:brightness(.62) saturate(.7);transition:transform 300ms var(--ease),filter 300ms var(--ease)}
.dlg.shake{animation:shake 380ms var(--ease-io)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.dlg-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 16px}
.dlg-head .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.dlg-head h2{font-size:19px;font-weight:600;letter-spacing:-.02em}
.dlg-head .s{font-size:13px;color:var(--fg-2)}
.dlg-x{
  margin-left:auto;width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;
  border-radius:var(--r-sm);color:var(--fg-3);
  transition:color 160ms var(--ease),background 160ms var(--ease),transform 220ms var(--ease);
}
.dlg-x:hover{color:var(--fg);background:var(--surface-2);transform:rotate(90deg)}
.dlg-body{padding:0 22px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.dlg-foot{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);
}
.dlg-foot .right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* details layout */
.details{display:grid;grid-template-columns:.92fr 1fr;gap:18px;align-items:start}
.panel{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.panel h3{font-size:13px;font-weight:600;letter-spacing:-.005em;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.kv{display:flex;flex-direction:column}
.kv-row{display:flex;align-items:flex-start;gap:12px;padding:9px 14px;border-bottom:1px dashed var(--line)}
.kv-row:last-child{border-bottom:0}
.kv-row .k{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-3);min-width:124px}
.kv-row .k::before{content:"";width:0;height:0;border-left:4px solid var(--fg-3);border-top:3px solid transparent;border-bottom:3px solid transparent;flex:0 0 auto}
.kv-row .v{margin-left:auto;text-align:right;font-size:13px;color:var(--fg);font-weight:500}
.kv-row .v.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* lifecycle chain */
.chain{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.chain-list{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:28px}
.chain-track{position:absolute;left:8px;top:12px;bottom:12px;width:1px;background:var(--line-2)}
.chain-fill{position:absolute;left:8px;top:12px;width:1px;background:var(--fg-2);height:0;transition:height 900ms var(--ease) 220ms}
.step{position:relative;border-radius:var(--r-md);padding:10px 12px;border:1px solid var(--line);background:var(--surface)}
.step .mk{position:absolute;left:-28px;top:12px;width:18px;height:18px;display:grid;place-items:center;border-radius:999px}
.step .nm{display:block;font-size:12.5px;font-weight:600;color:var(--fg-2)}
.step .ds{display:block;font-size:11.5px;color:var(--fg-3);margin-top:2px;line-height:1.4}
.step .st{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-top:6px;display:block}
.step.done .mk{background:var(--fg);color:var(--bg)}
.step.done .nm{color:var(--fg)}
.step.done .st{color:var(--fg-2)}
.step.current{border-color:var(--acc-ink);background:var(--accent-12);box-shadow:inset 3px 0 0 var(--acc-ink)}
.step.current .nm{color:var(--fg)}
.step.current .st{color:var(--acc-ink)}
.step.current .mk{border:2.5px solid var(--acc-ink);border-radius:999px}
.step.current .mk::after{content:"";position:absolute;inset:-2px;border-radius:999px;border:1px solid var(--acc-ink);animation:pulse-ring 2.8s var(--ease-io) infinite}
.step.wait{border-style:dashed}
.step.wait .mk{border:1.5px solid var(--line-2);border-radius:999px}
.action-card{
  border:1px solid var(--acc-ink);background:var(--accent-12);border-radius:var(--r-md);
  padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.action-card .ac-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.action-card .ac-t b{font-size:13px;font-weight:600;color:var(--fg)}
.action-card .ac-t span{font-size:11.5px;color:var(--fg-2)}
.action-card .btn{margin-left:auto}

/* compare table */
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
table.cmp-table{width:100%;border-collapse:separate;border-spacing:0;min-width:520px}
.cmp-table th,.cmp-table td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}
.cmp-table thead th{background:var(--surface-2);color:var(--fg);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.cmp-table tbody th{background:var(--surface-2);color:var(--fg-3);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-right:1px solid var(--line);width:160px}

.cmp-table td{color:var(--fg-2)}
.cmp-table td.diff{color:var(--fg);font-weight:600;background:var(--accent-12)}

/* --- reference form rows (New Promotion) --- */
.form-rows{display:flex;flex-direction:column;gap:16px}
.form-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.form-row .rl{align-self:center}
.form-row .rf{min-width:0;display:flex;flex-direction:column;gap:6px}
.radio-group{display:flex;align-items:center;gap:24px;flex-wrap:wrap;min-height:36px}
.radio{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);cursor:pointer;position:relative}
.radio input{position:absolute;opacity:0;width:0;height:0}
.radio .rb{
  width:16px;height:16px;flex:0 0 16px;border-radius:999px;border:1.5px solid var(--line-2);
  display:grid;place-items:center;transition:border-color 160ms var(--ease),border-width 160ms var(--ease);
}
.radio input:checked+.rb{border:2px solid var(--acc-ink)}
.radio input:checked+.rb::after{content:"";width:7px;height:7px;border-radius:999px;background:var(--acc-ink)}
.radio input:focus-visible+.rb{outline:2px solid var(--acc-ink);outline-offset:2px}
.radio.is-off{color:var(--fg-3);cursor:not-allowed}
.radio.is-off .rb{border-color:var(--line);opacity:.65}
.radio-group.stack{flex-direction:column;align-items:flex-start;gap:12px;min-height:0;padding:4px 0}
.radio-group.stack .radio{align-items:flex-start;line-height:1.45}
.radio-group.stack .rb{margin-top:1px}
.radio .rt{min-width:0}
.radio .rh{color:var(--fg-3)}
.notice{
  display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-md);
  border:1px dashed var(--line-2);background:var(--surface-2);font-size:12px;color:var(--fg-3);line-height:1.45;
}
.notice.attn{border-style:solid;border-color:var(--accent-40);background:var(--accent-12);color:var(--acc-ink)}
.notice svg{flex:0 0 auto;margin-top:1px}
.opt.wrap{align-items:flex-start}
.opt.wrap .l{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.4}
.opt .flag{
  font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--line-2);border-radius:3px;padding:1px 4px;color:var(--fg-3);flex:0 0 auto;
}
@media (max-width:640px){
  .form-row{grid-template-columns:1fr;gap:6px;align-items:start}

}

/* ==========================================================================
   Toast
   ========================================================================== */
.toasts{position:fixed;z-index:120;left:50%;transform:translateX(-50%);bottom:24px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.75);font-size:12.5px;color:var(--fg-2);
  animation:toastin 300ms var(--ease);max-width:min(560px,calc(100vw - 32px));
}
.toast .tk{color:var(--acc-ink);flex:0 0 auto;display:grid;place-items:center}
.toast b{color:var(--fg);font-weight:600}
.toast.out{animation:toastout 240ms var(--ease) forwards}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(6px)}}

/* ==========================================================================
   Motion — reveal
   ========================================================================== */
[data-reveal]{opacity:0;transform:translate3d(0,16px,0)}
[data-reveal].shown{opacity:1;transform:none;transition:opacity var(--dur) var(--ease) var(--d,0ms),transform var(--dur) var(--ease) var(--d,0ms)}
tr[data-row]{opacity:0;transform:translate3d(0,8px,0)}
tr[data-row].shown{opacity:1;transform:none;transition:opacity 460ms var(--ease) var(--d,0ms),transform 460ms var(--ease) var(--d,0ms)}
@media print{[data-reveal],tr[data-row]{opacity:1 !important;transform:none !important}}

/* ==========================================================================
   Breakpoints — 1536 / 1366 / 1280 / 1024 / 768 / 640
   ========================================================================== */
@media (min-width:1537px){ :root{--cell-x:16px} }
@media (max-width:1280px){
  :root{--gap:14px}
  .stages{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1024px){
  .scope-grid{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .work-grid{grid-template-columns:1fr}
  .projects{flex-direction:row;overflow-x:auto}
  .project{min-width:206px;flex:0 0 auto}
  .details{grid-template-columns:1fr}
}
@media (max-width:768px){
  .main{margin-left:0}
  .rail{
    transform:translateX(-100%);width:var(--rail-open);
    transition:transform 300ms var(--ease);
  }
  .rail.is-open{transform:none}
  .rail .rail-item .lbl,.rail .soon{opacity:1;transform:none}
  .rail-scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.5)}
  .topbar .burger{display:grid}
  .who{display:none}
  .langbtn span{display:none}
}
@media (max-width:640px){
  .brand .pw{display:none}
  .stages{grid-template-columns:1fr}
  .filters .field{flex:1 1 100%}
  .filter-actions{flex:1 1 100%}
  .filter-actions .btn:not(.iconbtn){flex:1}
  .swatches,.bar-div{display:none}
  .search{width:100%}
  .section-head .actions{width:100%}
  .section-head .actions .btn{flex:1}
  .dlgwrap{padding:0;place-items:stretch}
  .dlg{max-width:none;border-radius:0;border-left:0;border-right:0;border-bottom:0;max-height:100%}
  .toasts{left:16px;right:16px;bottom:16px;transform:none}
  .toast{max-width:none;width:100%;border-radius:var(--r-lg)}
}

/* ==========================================================================

.cfg-rows{display:flex;flex-direction:column}

.sev.s-warn{color:var(--warn)}
.sev.s-twinx{color:var(--twinx)}
.cell-in.s-bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.cell-in.s-warn{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.cell-in.s-twinx{border-color:var(--twinx);box-shadow:0 0 0 1px var(--twinx)}

/* Select Family dialog */

.fam-upload{display:flex;flex-direction:column;gap:8px}

.fam-upload .filerow{

.fam-upload .filerow .fname{padding:0 12px;font-size:13px;color:var(--fg-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filemsg{

}
.filemsg svg{flex:0 0 auto;margin-top:1px}
.filemsg.ok{border-color:color-mix(in srgb, var(--ok) 38%, transparent);background:color-mix(in srgb, var(--ok) 12%, var(--surface));color:var(--ok)}
.filemsg.bad{border-color:color-mix(in srgb, var(--bad) 38%, transparent);background:color-mix(in srgb, var(--bad) 12%, var(--surface));color:var(--bad)}
.filemsg b{color:inherit}
.fam-upload .uprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fam-upload .uprow .filerow{flex:1 1 320px;min-width:0}
.fam-upload .filerow .fname.set{color:var(--acc-ink);font-weight:500}
.fam-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.fam-bar .sbox,.fam-search .sbox{
  flex:1 1 220px;display:flex;align-items:center;gap:8px;min-width:0;
  border:1px solid var(--line-2);border-radius:999px;background:var(--surface-2);padding:0 14px;color:var(--fg-3);
}
.fam-bar .sbox:focus-within,.fam-search .sbox:focus-within{border-color:var(--acc-ink);box-shadow:0 0 0 3px var(--accent-20)}
.fam-bar input,.fam-search input{border:0;background:none;padding:9px 0;flex:1;min-width:0;font-size:13px;color:var(--fg)}
.fam-bar input:focus,.fam-search input:focus{outline:none;box-shadow:none}
.fam-bar #famUploadBtn{flex:0 0 auto;margin-left:auto}
.fam-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.fam-table{width:100%;border-collapse:collapse;font-size:12.5px}
.fam-table th{
  text-align:left;padding:10px 12px;white-space:nowrap;background:var(--surface-2);
  font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);
  border-bottom:1px solid var(--line);
}
.fam-table td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--fg)}
.fam-table tbody tr:last-child td{border-bottom:0}
.fam-table tbody tr:hover td{background:var(--surface-2)}
.fam-table tr.on td{background:var(--accent-12)}
.fam-table .c-num{text-align:right;font-variant-numeric:tabular-nums}
.fam-table .c-pick,.fam-table .c-act{width:1%;padding-right:4px}
.tone-chip{
  display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface-2);font-size:11.5px;color:var(--fg-2);
}
.tone-chip .sw{width:7px;height:7px;flex:0 0 7px;border-radius:2px}
.fam-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fam-foot[hidden]{display:none}
.fam-foot .count{font-size:12.5px;color:var(--fg-2)}
.fam-foot .pages{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.fam-foot .btn-primary{margin-left:auto}
.pg{
  min-width:28px;height:28px;padding:0 7px;display:inline-grid;place-items:center;
  border:1px solid transparent;border-radius:var(--r-sm);font-size:12px;color:var(--fg-2);
  font-family:var(--mono);
}
.pg:hover:not(:disabled){border-color:var(--line-2);color:var(--fg)}
.pg.cur{border-color:var(--acc-ink);color:var(--fg);background:var(--surface-3)}
.pg:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:640px){
  .fam-foot .btn-primary{margin-left:0;width:100%;justify-content:center}
}

.cfg-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cfg-foot .right{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* --- Step 3 · Simulation Results --------------------------------------- */
.ph-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ph-row h1{flex:1 1 auto;min-width:0}
.ph-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.iter-pick select{
  height:34px;padding:0 10px;min-width:170px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--acc-fg);border-color:var(--accent);font-size:13px;
}
.iter-pick select:focus{box-shadow:0 0 0 3px var(--accent-20)}
.iter-pick select option{background:var(--surface);color:var(--fg)}

.ctxstrip{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--acc-ink);border-radius:var(--r-lg);
  padding:12px 14px;box-shadow:var(--shadow);
}
.ctxstrip .cs{display:flex;align-items:flex-start;gap:26px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.ctxstrip .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.ctxstrip .k{font-size:11.5px;color:var(--fg-3)}
.ctxstrip .v{font-size:13px;font-weight:600;color:var(--fg)}
.ctxstrip .v.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}
.thr-toggle{
  display:inline-flex;align-items:center;gap:9px;flex:0 0 auto;
  height:40px;padding:0 16px;border:1px solid var(--line-2);border-radius:var(--r-md);
  background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--fg);
  transition:border-color 180ms var(--ease),background 180ms var(--ease);
}
.thr-toggle svg{color:var(--fg-3)}
.thr-toggle:hover{border-color:var(--fg-3)}
.thr-toggle[aria-pressed="true"]{background:var(--accent-12);border-color:var(--acc-ink)}
.thr-toggle[aria-pressed="true"] svg{color:var(--acc-ink)}
.thr-toggle:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px}

.sim-filters{display:flex;gap:12px;flex-wrap:wrap}
.sim-filters select{flex:0 1 280px;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.kpi .kh{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);
  font-size:12px;color:var(--fg-2);text-align:center;
}
.kpi .kh .i{color:var(--fg-3);display:inline-flex}
.kpi .kb{display:flex}
.kpi .half{
  flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 8px 12px;border-right:1px solid var(--line);
}
.kpi .half:last-child{border-right:0}
.kpi .half.wide{padding:16px 8px}
.kpi .t{font-size:11.5px;color:var(--fg-3)}
.kpi .n{font-size:15px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}

.cmp-table th{vertical-align:middle;text-align:center;white-space:normal}
.cmp-table th.grp{text-align:center;border-bottom:1px solid var(--line);font-size:11px}
.cmp-table th.sub2{
  font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;
  color:var(--fg-2);line-height:1.6;border-bottom:1px solid var(--line);padding:8px 12px;
}
.cmp-table th.sub2 b{font-weight:600;color:var(--fg)}
.cmp-table th.c-metric,.cmp-table td.c-metric{text-align:left;min-width:230px}
.cmp-table td.c-metric{
  display:table-cell;font-weight:600;background:var(--surface);
}
.cmp-table td.c-metric .nm{margin-right:8px}
.cmp-table td.c-metric .i{color:var(--fg-3);display:inline-flex;vertical-align:-2px}
.cmp-table td.c-num{min-width:112px}
.v-model{color:var(--twinx);font-weight:600}

.sim-table th.grp{text-align:center;border-bottom:1px solid var(--line)}
.sim-table th.sub2{
  font-size:10.5px;font-weight:500;text-transform:none;letter-spacing:0;
  color:var(--fg-2);text-align:right;white-space:normal;min-width:104px;
}
.sim-table th.c-name,.sim-table td.c-name{text-align:left;min-width:220px}
.sim-table .nmwrap{display:flex;align-items:center;gap:8px}
.sim-table .nmwrap .spacer{width:24px;flex:0 0 24px}
.sim-table .nm{font-weight:500}
.sim-table tr.flagged .nm{color:var(--fg)}
.sim-table td.cell-flag{
  color:var(--bad);font-weight:600;
  box-shadow:inset 0 0 0 1px var(--bad);border-radius:var(--r-sm);
}

.sim-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.v-ok{color:var(--ok);font-weight:600}
.v-bad{color:var(--bad);font-weight:600}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .sim-pair{grid-template-columns:1fr}
  .ctxstrip .cs{gap:14px}
  .sim-filters select{flex:1 1 160px}
}
@media (max-width:640px){
  .kpis{grid-template-columns:1fr}
  .ph-actions{width:100%}
  .iter-pick{flex:1 1 auto}
  .iter-pick select{width:100%}
}

@media (max-width:900px){
  .cfg-row{grid-template-columns:1fr;gap:8px;align-items:start;padding:14px}
  .cfg-row .rl{align-self:start}
  .cfg-row .rf > input[type="text"],.cfg-row .rf > select,.cfg-row .rf > .control{flex:1 1 100%}
  .wz-line{flex:0 1 80px}
}
@media (max-width:640px){
  .wizard{gap:0}
  .wz-step .nm{font-size:11.5px}
}

/* --- Report Hub --------------------------------------------------------- */
.ph-main{flex:1 1 auto;min-width:0}
.crumb .ci{display:inline-flex;color:var(--fg-3)}
.btn.btn-sm{height:30px;padding:0 12px;font-size:12px}

.rep-tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.rep-tab{
  height:32px;padding:0 18px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg-2);
  transition:background 180ms var(--ease),color 180ms var(--ease);
}
.rep-tab:hover{color:var(--fg)}
.rep-tab[aria-selected="true"]{background:var(--accent);color:var(--acc-fg);font-weight:600}
.rep-tab:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px}

.rep-filters{
  display:flex;flex-direction:column;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px 16px;box-shadow:var(--shadow);
}
.rf-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.rf-row > select,.rf-row > input[type="date"]{flex:1 1 200px;min-width:0}
.rf-act{margin-left:auto;display:flex;gap:10px;align-items:center;flex:0 0 auto}

.card-head .tag b{font-family:var(--mono)}
.card-head .agg{display:flex;align-items:center;gap:10px;margin-left:auto}
.card-head .agg .k{font-size:13px;font-weight:600;color:var(--fg)}
.card-head .agg select{height:32px;padding:0 8px;font-size:12.5px;width:auto}
.card-head{flex-wrap:wrap}
.card-head h2{min-width:0}
.card-head #elCompare{margin-left:auto;flex:0 0 auto}
.card-head .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.card-head .t .s{font-size:12.5px;color:var(--fg-2);font-weight:400}
.card-head .t .s .i{display:inline-flex;vertical-align:-2px;color:var(--fg-3)}

.stages{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 4px 4px;flex-wrap:wrap}
.stage-node{
  position:relative;flex:1 1 130px;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding-top:4px;list-style:none;
}
.stage-node .sn-line{
  position:absolute;top:26px;right:calc(50% + 26px);left:calc(-50% + 26px);height:0;
  border-top:1.5px dashed var(--line-2);
}
.sn-ring{
  width:48px;height:48px;border-radius:999px;display:grid;place-items:center;
  border:1.5px solid var(--line-2);background:var(--surface);color:var(--fg-2);position:relative;z-index:1;
}
.sn-ring.t-muted{color:var(--fg-3)}
.sn-ring.t-warn{color:var(--warn);border-color:color-mix(in srgb, var(--warn) 46%, transparent);background:color-mix(in srgb, var(--warn) 10%, var(--surface))}
.sn-ring.t-accent{color:var(--acc-ink);border-color:var(--accent-40);background:var(--accent-12)}
.sn-ring.t-twinx{color:var(--twinx);border-color:color-mix(in srgb, var(--twinx) 46%, transparent);background:color-mix(in srgb, var(--twinx) 10%, var(--surface))}
.sn-ring.t-ok{color:var(--ok);border-color:color-mix(in srgb, var(--ok) 46%, transparent);background:color-mix(in srgb, var(--ok) 10%, var(--surface))}
.sn-n{font-size:17px;font-weight:600;line-height:1.2}
.sn-l{font-size:12.5px;color:var(--fg-2);text-align:center;line-height:1.35}

.perf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.perf{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line);border-radius:var(--r-md);padding:16px 14px;background:var(--surface);
}
.perf .pl{font-size:12.5px;color:var(--fg-2)}
.perf .pv{font-size:19px;font-weight:600;color:var(--acc-ink);letter-spacing:-.02em}
.perf.uplift{align-items:stretch;gap:9px;padding:14px}
.perf.uplift .pl{align-self:flex-start}
.up-track{position:relative;height:9px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line);overflow:hidden}
.up-fill{position:absolute;inset:0 auto 0 0;background:var(--bad)}
.up-fill.ok{background:var(--ok)}
.up-mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg-3);transform:translateX(-1px)}
.up-legend{display:flex;justify-content:space-between;gap:8px}
.up-legend .um{display:flex;flex-direction:column;font-size:10.5px;color:var(--fg-3);line-height:1.35}
.up-legend .um b{font-size:11.5px;color:var(--fg-2);font-weight:500}
.up-legend .um.mid{align-items:center}
.up-legend .um.end{align-items:flex-end}

.rep-table th{vertical-align:bottom;white-space:normal}
.rep-table .c-tog{width:1%;padding-left:0;padding-right:0}
.rep-table .nm{font-weight:500}
.mchips{display:inline-flex;gap:5px;flex-wrap:wrap}
.mchip{
  display:inline-flex;align-items:center;padding:2px 9px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--surface-2);font-size:11.5px;color:var(--fg-2);
}
.mtr{display:inline-flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:96px}
.mtr b{font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mtr-t{display:block;width:100%;height:5px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line);overflow:hidden}
.mtr-t s{display:block;height:100%;background:var(--fg-3);text-decoration:none}
.mtr-t s.ok{background:var(--ok)}
.rep-detail{display:flex;gap:22px;flex-wrap:wrap;padding:2px 0}
.rep-detail .rd{display:flex;flex-direction:column;gap:2px}
.rep-detail .k{font-size:11px;color:var(--fg-3)}
.rep-detail .v{font-size:12px;color:var(--fg-2)}

/* The chart scrolls rather than shrinking, so its labels stay readable on a
   phone. */
.chart-wrap{display:flex;flex-direction:column;gap:10px;overflow-x:auto}
.el-chart{width:100%;min-width:680px;height:auto;display:block;overflow:visible}
.el-band{fill:var(--surface-3);opacity:.85}
.el-grid{stroke:var(--line);stroke-width:1}
.el-zero{stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 4}
.el-tick{fill:var(--fg-3);font-size:12px;font-family:var(--mono)}
.el-axis{fill:var(--fg-2);font-size:12px}
.el-note{fill:var(--fg-2);font-size:12px}
.el-line{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.el-organic{stroke:var(--c1)}
/* Dashed as well as lighter, so the two curves separate on the monochrome
   accent and for anyone who cannot rely on hue. */
.el-promo{stroke:var(--c5);stroke-dasharray:7 5}
.el-dot{fill:var(--c1);stroke:var(--surface);stroke-width:2}
.el-legend{display:flex;gap:18px;justify-content:flex-end;flex-wrap:wrap}
.el-legend .lk{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-2)}
.el-legend .sw{width:16px;height:3px;border-radius:2px;background:currentColor}
.el-legend .sw.el-organic{background:var(--c1)}
.el-legend .sw.el-promo{
  background:transparent;height:0;border-top:3px dashed var(--c5);border-radius:0;
}
.el-legend .sw.band{width:13px;height:13px;border-radius:3px;background:var(--surface-3);border:1px solid var(--line-2)}

.el-table .sortbtn{display:inline-flex;align-items:center;gap:5px;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit}
.el-table .sortbtn:hover{color:var(--fg)}
.el-table .c-num .sortbtn{justify-content:flex-end;width:100%}
.el-rule{margin-top:12px;font-size:12.5px;color:var(--fg-2)}
.tone-chip.t-ok{border-color:color-mix(in srgb, var(--ok) 40%, transparent);background:color-mix(in srgb, var(--ok) 12%, var(--surface));color:var(--ok)}
.tone-chip.t-warn{border-color:color-mix(in srgb, var(--warn) 40%, transparent);background:color-mix(in srgb, var(--warn) 12%, var(--surface));color:var(--warn)}
.tone-chip.t-ok .sw{background:var(--ok)}
.tone-chip.t-warn .sw{background:var(--warn)}
.tone-chip.t-bad .sw{background:var(--bad)}

@media (max-width:1100px){
  .perf-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .stages{gap:18px}
  .stage-node{flex:1 1 44%}
  .stage-node .sn-line{display:none}
  .rf-act{margin-left:0;width:100%}
  .rf-act .btn{flex:1 1 auto;justify-content:center}
  .card-head .agg{margin-left:0;width:100%}
}
@media (max-width:640px){
  .perf-grid{grid-template-columns:1fr}
  .rep-tabs{width:100%}
  .rep-tab{flex:1 1 auto}
}

/* --- Promotion Validation / Logistics Volume Split ---------------------- */
.sumband{
  display:flex;align-items:flex-start;gap:16px;

  padding:14px 16px;box-shadow:var(--shadow);
}
.sumband .cs{display:flex;align-items:flex-start;gap:28px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.sumband .f{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:220px}
.sumband .k{font-size:11.5px;color:var(--fg-3)}
.sumband .v{font-size:13px;font-weight:600;color:var(--fg);line-height:1.35}
.sumband .v.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}

.va-controls{display:flex;gap:12px;flex-wrap:wrap}

.va-controls #vaComments{flex:1 1 260px;min-width:0}
.va-controls select{flex:0 1 200px;min-width:0}

.va-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);
}
.va-bar .t{display:flex;flex-direction:column;gap:3px;flex:1 1 auto;min-width:0}
.va-bar .t b{font-size:13px;font-weight:600}
.va-bar .t .s{font-size:12px;color:var(--fg-2)}
.va-bar .t .sep{color:var(--fg-3);margin:0 3px}
.va-bar .btn-primary{margin-left:auto}

.va-table{margin-top:14px}
